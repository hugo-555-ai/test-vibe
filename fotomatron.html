<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotomatón - 4 Fotos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-2: #ff8e8e;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #14142b;
            --dark-2: #232345;
            --light: #f7fff7;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Fredoka', 'Comic Neue', 'Segoe UI', system-ui, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(78, 205, 196, 0.18), transparent 45%),
                radial-gradient(circle at 90% 100%, rgba(255, 107, 107, 0.18), transparent 45%),
                linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 100%);
            color: var(--light);
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr) 280px;
            grid-template-rows: auto minmax(0, 1fr) auto;
            grid-template-areas:
                "header header header"
                "strip camera props"
                "status status status";
            gap: 14px;
            padding: 0 14px 10px;
        }

        header {
            grid-area: header;
            margin: 0 -14px;
            text-align: center;
            padding: 10px 0;
            background: linear-gradient(90deg, var(--primary), #ff9f6b, var(--accent), var(--secondary));
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 1.9em;
            letter-spacing: 1px;
            color: var(--dark);
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.45);
        }

        /* ===== Photo strip (left) ===== */
        .photo-strip-container {
            grid-area: strip;
            min-height: 0;
            display: flex;
            padding: 12px;
            background: #0b0b18;
            border-radius: 14px;
            border: 2px solid var(--panel-border);
            box-shadow: inset 0 0 0 6px #1b1b33, 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .photo-strip {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .photo-slot {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            transition: border-color 0.3s, background 0.3s, transform 0.3s;
        }

        .photo-slot img {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-slot .slot-number {
            font-size: 2.2em;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
        }

        .photo-slot.filled {
            border: 3px solid #fff;
            background: #fff;
            animation: pop 0.45s ease;
        }

        .photo-slot.filled img { display: block; }
        .photo-slot.filled .slot-number { display: none; }

        .photo-slot.next {
            border-color: var(--accent);
            background: rgba(255, 230, 109, 0.1);
        }

        @keyframes pop {
            0% { transform: scale(0.85) rotate(-3deg); }
            60% { transform: scale(1.04) rotate(1deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .photo-slot .next-countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4em;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 18px;
            border-radius: 12px;
            display: none;
        }

        .photo-slot.next .next-countdown { display: block; }

        /* ===== Camera (center) ===== */
        .camera-container {
            grid-area: camera;
            position: relative;
            min-height: 0;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid var(--secondary);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15), 0 14px 40px rgba(0, 0, 0, 0.5);
        }

        #previewCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #cameraView {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .camera-frame {
            position: absolute;
            inset: 12px;
            border: 2px dashed rgba(255, 230, 109, 0.7);
            border-radius: 12px;
            pointer-events: none;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .flash.go { animation: flash 0.45s ease-out; }

        @keyframes flash {
            0% { opacity: 0.95; }
            100% { opacity: 0; }
        }

        .rec-badge {
            position: absolute;
            top: 22px;
            left: 24px;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.55);
            font-weight: 600;
            z-index: 12;
        }

        .rec-badge.active { display: flex; }

        .rec-badge::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.2; } }

        .countdown-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .countdown-display {
            display: none;
            min-width: 180px;
            text-align: center;
            font-size: 7em;
            font-weight: 700;
            line-height: 1;
            color: var(--accent);
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            animation: bounce 1s ease infinite;
            background: rgba(0, 0, 0, 0.45);
            padding: 20px 40px;
            border-radius: 24px;
        }

        .countdown-display.active { display: block; }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .start-btn-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22px;
            display: flex;
            justify-content: center;
            z-index: 15;
            pointer-events: none;
        }

        .start-btn-container .btn {
            pointer-events: auto;
            width: 400px;
            max-width: 85%;
            height: 100px;
            border-radius: 18px;
            font-size: 1.7em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 107, 107, 0.55); }
            50% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 16px rgba(255, 107, 107, 0); }
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.45);
        }

        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn.secondary {
            background: transparent;
            border: 2px solid var(--panel-border);
            color: var(--light);
        }

        /* ===== Props (right) ===== */
        .props-section {
            grid-area: props;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            background: var(--panel);
            border: 2px solid var(--panel-border);
            border-radius: 14px;
        }

        .props-section h2 {
            text-align: center;
            margin-bottom: 10px;
            color: var(--secondary);
            font-size: 1.3em;
        }

        .props-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .prop-tab {
            padding: 6px 11px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85em;
        }

        .prop-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .prop-tab.active {
            border-color: var(--accent);
            color: var(--dark);
            background: var(--accent);
        }

        .props-grid {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
            grid-auto-rows: min-content;
            gap: 10px;
            padding: 4px;
        }

        .prop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 4px 6px;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: inherit;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .prop-item:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .prop-item.selected {
            border-color: var(--secondary);
            background: rgba(78, 205, 196, 0.2);
            box-shadow: 0 0 18px rgba(78, 205, 196, 0.5);
        }

        .prop-item .prop-emoji { font-size: 2em; line-height: 1.2; }

        .prop-item .prop-name {
            font-size: 0.75em;
            font-weight: 600;
            text-align: center;
        }

        .accessory-controls {
            margin-top: 10px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            max-height: 52%;
            overflow-y: auto;
        }

        .accessory-controls label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .accessory-controls input[type=range] {
            width: 100%;
            accent-color: var(--secondary);
        }

        .accessory-controls .btn.small {
            width: 100%;
            margin-top: 6px;
            padding: 5px 10px;
            font-size: 0.8em;
            letter-spacing: 0.5px;
            text-transform: none;
            box-shadow: none;
        }

        .placed-title {
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--accent);
        }

        .placed-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: stretch;
            border: 2px solid var(--panel-border);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
        }

        .chip.selected {
            border-color: var(--accent);
            background: rgba(255, 230, 109, 0.18);
        }

        .chip button {
            border: none;
            background: transparent;
            color: var(--light);
            font-family: inherit;
            font-size: 0.78em;
            font-weight: 600;
            padding: 4px 8px;
            cursor: pointer;
        }

        .chip .chip-remove { border-left: 1px solid var(--panel-border); }
        .chip .chip-remove:hover { background: var(--primary); color: #fff; }

        .remove-row { display: flex; gap: 6px; }
        .remove-row .btn { margin-top: 6px; }
        .btn.danger:hover:not(:disabled) { background: rgba(255, 107, 107, 0.25); box-shadow: none; }

        .prop-item { position: relative; }

        .prop-count {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.72em;
            font-weight: 700;
            color: var(--dark);
            background: var(--accent);
            border-radius: 10px;
            padding: 0 6px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 8px 0 2px;
        }

        .dpad button {
            height: 34px;
            border: 2px solid var(--panel-border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 0.9em;
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        .dpad button:active { background: var(--secondary); color: var(--dark); }

        .camera-container, #previewCanvas { user-select: none; -webkit-user-select: none; }

        .accessory-controls .hint {
            margin-top: 8px;
            font-size: 0.72em;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.65);
        }

        .props-summary {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--panel-border);
            font-size: 0.8em;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== Status ===== */
        .status-container {
            grid-area: status;
            text-align: center;
        }

        .status-text {
            color: var(--accent);
            font-weight: 600;
            font-size: 1.1em;
        }

        /* ===== Error modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--dark);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal h3 { color: var(--primary); margin-bottom: 15px; font-size: 1.8em; }
        .modal p { margin-bottom: 25px; color: rgba(255, 255, 255, 0.9); line-height: 1.6; }
        .modal-actions { display: flex; justify-content: center; gap: 15px; }

        /* ===== Responsive ===== */
        @media (min-width: 1920px) and (min-height: 1080px) {
            body { grid-template-columns: 300px minmax(0, 1fr) 340px; }
        }

        @media (max-width: 1000px) {
            body {
                height: auto;
                overflow: auto;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto auto auto auto;
                grid-template-areas:
                    "header"
                    "camera"
                    "strip"
                    "props"
                    "status";
            }

            .camera-container { aspect-ratio: 4 / 3; }

            .photo-strip-container { padding: 8px; }
            .photo-strip { flex-direction: row; }
            .photo-slot { aspect-ratio: 4 / 3; }
            .props-section { max-height: 420px; }
            .countdown-display { font-size: 4.5em; }
            .start-btn-container .btn { height: 80px; font-size: 1.4em; }
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <h3>Error de cámara</h3>
            <p id="errorMessage">No se pudo acceder a la cámara.</p>
            <div class="modal-actions">
                <button class="btn" onclick="retryCamera()">Reintentar</button>
                <button class="btn secondary" onclick="closeErrorModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <header>
        <h1>📸 Fotomatón</h1>
    </header>

    <div class="photo-strip-container">
        <div class="photo-strip" id="photoStrip"></div>
    </div>

    <div class="camera-container">
        <video id="cameraView" autoplay playsinline muted></video>
        <canvas id="previewCanvas"></canvas>
        <div class="camera-frame"></div>
        <div class="rec-badge" id="recBadge">Foto <span id="recCount">1</span>/4</div>
        <div class="flash" id="flash"></div>
        <div class="countdown-container">
            <div class="countdown-display" id="countdownDisplay"></div>
        </div>
        <div class="start-btn-container">
            <button class="btn" id="startBtn" onclick="startPhotoBooth()">
                <span id="startBtnText">Empezar</span>
            </button>
        </div>
    </div>

    <div class="props-section">
        <h2>Accesorios</h2>
        <div class="props-tabs" id="propsTabs"></div>
        <div class="props-grid" id="propsGrid"></div>
        <div class="accessory-controls" id="accessoryControls" style="display:none;">
            <div class="placed-title">Accesorios puestos</div>
            <div class="placed-list" id="placedList"></div>
            <label for="sizeSlider"><span id="sizeLabel">Tamaño</span> <span id="sizeValue">100%</span></label>
            <input type="range" id="sizeSlider" min="0.4" max="2.5" step="0.05" value="1" oninput="onSizeSlider(this.value)">
            <div class="dpad" aria-label="Mover accesorio">
                <button type="button" class="dpad-left" onpointerdown="startNudge(-0.03,0)" title="Izquierda">◀</button>
                <button type="button" class="dpad-up" onpointerdown="startNudge(0,-0.03)" title="Subir">▲</button>
                <button type="button" class="dpad-down" onpointerdown="startNudge(0,0.03)" title="Bajar">▼</button>
                <button type="button" class="dpad-right" onpointerdown="startNudge(0.03,0)" title="Derecha">▶</button>
            </div>
            <button class="btn secondary small" type="button" onclick="resetAccessory()">↺ Restablecer</button>
            <div class="remove-row">
                <button class="btn secondary small danger" type="button" onclick="removeSelected()">🗑 Quitar este</button>
                <button class="btn secondary small danger" type="button" onclick="clearAccessories()">Quitar todos</button>
            </div>
            <p class="hint">Pulsa varios accesorios para ponerlos a la vez. Arrastra sobre la cámara para moverlo (o usa las flechas); rueda o pellizco para el tamaño; Supr para quitarlo.</p>
        </div>
        <div class="props-summary" id="propsSummary"></div>
    </div>

    <div class="status-container">
        <div class="status-text" id="statusText">Listo para empezar</div>
    </div>

    <script>
// ===== Configuration =====
var PHOTO_COUNT = 4;
var TIME_BETWEEN_PHOTOS = 3;
var COUNTDOWN_TIME = 3;
var CTX_FILTER_SUPPORTED = (typeof CanvasRenderingContext2D !== 'undefined') && ('filter' in CanvasRenderingContext2D.prototype);

// ===== Global State =====
var stream = null;
var cameraView = null;
var previewCanvas = null;
var previewCtx = null;
var vidCanvas = document.createElement('canvas');   // offscreen: mirrored + filtered video frame
var vidCtx = vidCanvas.getContext('2d');
var photos = [];
var currentPhotoIndex = 0;
var isSessionRunning = false;
var sessionTimers = [];
var currentPropTab = 'filter';
var selectedProps = { filter: 'none', distort: 'none', background: 'none' };   // single-choice categories
var placed = [];          // hats & glasses worn: { uid, kind, id, dx, dy, scale } (dx/dy in face-widths)
var nextUid = 1;
var selectedUid = null;   // accessory targeted by drag / wheel / slider
var effects = [];         // active effect ids (they can be combined)
var dragState = null;
var activePointers = {};
var renderHQ = false;         // full-resolution distortion while capturing
var faceBox = null;           // detected face (canvas coordinates) or null -> heuristic
var faceMisses = 0;
var faceDetector = null;
var faceBusy = false;

// ===== Prop Definitions =====
var propCategories = [
    { key: 'filter', label: 'Filtros', icon: '🎨', items: [
        { id: 'none', name: 'Normal', emoji: '📷' },
        { id: 'sepia', name: 'Sepia', emoji: '🟤' },
        { id: 'grayscale', name: 'B/N', emoji: '⚫' },
        { id: 'invert', name: 'Negativo', emoji: '🔄' },
        { id: 'vintage', name: 'Vintage', emoji: '📼' },
        { id: 'warm', name: 'Cálido', emoji: '🔥' },
        { id: 'cool', name: 'Frío', emoji: '❄️' },
        { id: 'blur', name: 'Suave', emoji: '💫' },
        { id: 'halloween', name: 'Halloween', emoji: '🎃' }
    ]},
    { key: 'distort', label: 'Distorsión', icon: '🌀', items: [
        { id: 'none', name: 'Ninguna', emoji: '🚫' },
        { id: 'bulge', name: 'Ojo de pez', emoji: '🐟' },
        { id: 'pinch', name: 'Pellizco', emoji: '🤏' },
        { id: 'swirl', name: 'Torbellino', emoji: '🌀' },
        { id: 'wave', name: 'Ondas', emoji: '🌊' },
        { id: 'mirror', name: 'Espejo', emoji: '🪞' },
        { id: 'wide', name: 'Feria ancha', emoji: '↔️' },
        { id: 'tall', name: 'Alargado', emoji: '↕️' },
        { id: 'pixelate', name: 'Pixelado', emoji: '🔲' }
    ]},
    { key: 'hat', label: 'Sombreros', icon: '🎩', items: [
        { id: 'none', name: 'Ninguno', emoji: '🚫' },
        { id: 'cowboy', name: 'Vaquero', emoji: '🤠' },
        { id: 'crown', name: 'Corona', emoji: '👑' },
        { id: 'santa', name: 'Santa', emoji: '🎅' },
        { id: 'party', name: 'Fiesta', emoji: '🥳' },
        { id: 'chef', name: 'Chef', emoji: '👨‍🍳' },
        { id: 'pirate', name: 'Pirata', emoji: '🏴‍☠️' },
        { id: 'graduation', name: 'Graduación', emoji: '🎓' },

// ===== Utilities =====
function mulberry32(a) {
    return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
}

function getCategory(key) {
    for (var i = 0; i < propCategories.length; i++) if (propCategories[i].key === key) return propCategories[i];
    return null;
}

// ===== Initialization =====
document.addEventListener('DOMContentLoaded', function() {
    cameraView = document.getElementById('cameraView');
    previewCanvas = document.getElementById('previewCanvas');
    previewCtx = previewCanvas.getContext('2d');
    previewCanvas.width = 1280;
    previewCanvas.height = 960;

// ===== Camera Functions =====
async function initializeCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showErrorModal('Tu navegador no permite acceder a la cámara. Abre la página en Chrome, Firefox o Edge (por https o localhost).');
        return;
    }
    try {
        stopCamera();
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
            audio: false
        });
        cameraView.srcObject = stream;
        try { await cameraView.play(); } catch (e) { /* autoplay handled by attribute */ }
        updateStatus('Cámara lista. ¡Elige tus accesorios!');
        setupFaceDetector();
    } catch (error) {
        var msg = 'No se pudo acceder a la cámara.';
        if (error && (error.name === 'NotAllowedError' || error.name === 'SecurityError')) msg = 'Permiso de cámara denegado. Permite el acceso a la cámara en tu navegador y pulsa Reintentar.';
        else if (error && error.name === 'NotFoundError') msg = 'No se encontró ninguna cámara conectada.';
        else if (error && error.name === 'NotReadableError') msg = 'La cámara está siendo usada por otra aplicación.';
        else if (error && error.message) msg = 'Error: ' + error.message;
        updateStatus('Cámara no disponible');
        showErrorModal(msg);
    }
}

function stopCamera() {
    if (stream) { stream.getTracks().forEach(function(track) { track.stop(); }); stream = null; }
}

function setupFaceDetector() {
    // Experimental Shape Detection API (Chrome). Falls back to a centered face box.
    try {
        if ('FaceDetector' in window && !faceDetector) faceDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
    } catch (e) { faceDetector = null; }
}

function detectFace() {
    if (!faceDetector || faceBusy || !cameraView || cameraView.readyState < 2) return;
    faceBusy = true;
    faceDetector.detect(cameraView).then(function(faces) {
        faceBusy = false;
        if (faces && faces.length) {
            var b = faces[0].boundingBox;
            var w = previewCanvas.width;
            var target = { cx: w - (b.x + b.width / 2), top: b.y - b.height * 0.05, w: b.width * 1.05, h: b.height * 1.05 };
            if (faceBox) {
                faceBox.cx += (target.cx - faceBox.cx) * 0.5;
                faceBox.top += (target.top - faceBox.top) * 0.5;
                faceBox.w += (target.w - faceBox.w) * 0.5;
                faceBox.h += (target.h - faceBox.h) * 0.5;
            } else {
                faceBox = target;
            }
            faceMisses = 0;
        } else if (++faceMisses > 15) {
            faceBox = null;
        }
    }).catch(function() { faceBusy = false; faceDetector = null; faceBox = null; });
}

function getFace(w, h) {
    if (faceBox) {
        var fh = faceBox.h;
        return { cx: faceBox.cx, top: faceBox.top, w: faceBox.w, h: fh, eyeY: faceBox.top + fh * 0.42 };
    }
    var fw = w * 0.3;
    var fhh = fw * 1.25;
    var top = h * 0.22;
    return { cx: w / 2, top: top, w: fw, h: fhh, eyeY: top + fhh * 0.42 };
}

// ===== Render loop (live preview + capture use the same pipeline) =====
var lastFaceCheck = 0;

function renderLoop(now) {
    if (cameraView && previewCtx) {
        if (cameraView.videoWidth && (previewCanvas.width !== cameraView.videoWidth || previewCanvas.height !== cameraView.videoHeight)) {
            previewCanvas.width = cameraView.videoWidth;
            previewCanvas.height = cameraView.videoHeight;
        }
        if (now - lastFaceCheck > 200) { lastFaceCheck = now; detectFace(); }
        renderFrame(previewCtx, previewCanvas.width, previewCanvas.height, now, true);
    }
    requestAnimationFrame(renderLoop);
}

function renderFrame(ctx, w, h, t, guides) {
    var bg = selectedProps.background;
    var hasBg = bg && bg !== 'none';

    drawVideoLayer(w, h, t);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    if (hasBg) {
        drawBackground(ctx, w, h, bg, t);
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.54, w * 0.38, h * 0.49, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(vidCanvas, 0, 0);
        ctx.restore();
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.54, w * 0.38, h * 0.49, 0, 0, Math.PI * 2);
        ctx.lineWidth = Math.max(4, w * 0.008);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.stroke();
    } else {
        ctx.drawImage(vidCanvas, 0, 0);
    }

    var face = getFace(w, h);
    drawPlaced(ctx, face);
    effects.forEach(function(id) { drawEffect(ctx, w, h, id, t); });
    if (guides) drawGuides(ctx, face);
}

// ===== Placed accessories: hats & glasses, as many as wanted, each with its own place/size =====
function findItem(uid) {
    for (var i = 0; i < placed.length; i++) if (placed[i].uid === uid) return placed[i];
    return null;
}

function getSelectedItem() { return findItem(selectedUid); }

function itemMeta(item) {
    var cat = getCategory(item.kind);
    for (var i = 0; i < cat.items.length; i++) if (cat.items[i].id === item.id) return cat.items[i];
    return { name: item.id, emoji: '•' };
}

function refreshAccessoryUI() {
    loadProps();
    updateSummary();
    updateAccessoryControls();
}

function addAccessory(kind, id) {
    var same = placed.filter(function(p) { return p.kind === kind; }).length;
    var spread = [0, 0.45, -0.45, 0.9, -0.9];            // so repeated accessories don't sit exactly on top of each other
    var item = { uid: nextUid++, kind: kind, id: id, dx: spread[same % spread.length], dy: 0, scale: 1 };
    placed.push(item);
    selectedUid = item.uid;
    refreshAccessoryUI();
}

function fixSelection() {
    if (!findItem(selectedUid)) selectedUid = placed.length ? placed[placed.length - 1].uid : null;
}

function removeAccessory(uid) {
    placed = placed.filter(function(p) { return p.uid !== uid; });
    fixSelection();
    refreshAccessoryUI();
}

function clearAccessories(kind) {
    placed = kind ? placed.filter(function(p) { return p.kind !== kind; }) : [];
    fixSelection();
    refreshAccessoryUI();
}

function removeSelected() {
    if (selectedUid !== null) removeAccessory(selectedUid);
}

function toggleEffect(id) {
    var i = effects.indexOf(id);
    if (i >= 0) effects.splice(i, 1); else effects.push(id);
    loadProps();
    updateSummary();
}

// ===== Move / resize hats & glasses =====
function getAccessoryBox(item, f) {
    var u = f.w, s = item.scale;
    if (item.kind === 'hat') {
        var y0 = f.top + f.h * 0.12 + item.dy * u;
        var cx = f.cx + item.dx * u;
        return { x0: cx - 0.62 * u * s, x1: cx + 0.62 * u * s, y0: y0 - 0.8 * u * s, y1: y0 + 0.12 * u * s };
    }
    var ey = f.eyeY + item.dy * u;
    var gx = f.cx + item.dx * u;
    return { x0: gx - 0.62 * u * s, x1: gx + 0.62 * u * s, y0: ey - 0.27 * u * s, y1: ey + 0.27 * u * s };
}

function drawPlaced(ctx, f) {
    placed.forEach(function(item) {
        if (item.kind === 'hat') drawHat(ctx, f, item.id, item);
        else drawGlasses(ctx, f, item.id, item);
    });
}

function drawGuides(ctx, f) {
    var item = getSelectedItem();
    if (!item) return;
    var b = getAccessoryBox(item, f);
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = Math.max(2, previewCanvas.width * 0.003);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffe66d';
    var hs = Math.max(8, previewCanvas.width * 0.01);
    ctx.fillRect(b.x1 - hs / 2, b.y1 - hs / 2, hs, hs);
    ctx.restore();
}

function canvasPoint(ev) {
    var rect = previewCanvas.getBoundingClientRect();
    var cw = previewCanvas.width, ch = previewCanvas.height;
    var scale = Math.max(rect.width / cw, rect.height / ch);      // object-fit: cover
    var offX = (rect.width - cw * scale) / 2, offY = (rect.height - ch * scale) / 2;
    return { x: (ev.clientX - rect.left - offX) / scale, y: (ev.clientY - rect.top - offY) / scale };
}

// Accessory under point p (nearest centre wins). "generous" widens the hit area for easier grabbing.
function pickAccessory(p, generous) {
    var f = getFace(previewCanvas.width, previewCanvas.height);
    var pad = generous ? f.w * 0.2 : 0;
    var best = null, bestDist = Infinity;
    placed.forEach(function(item) {
        var b = getAccessoryBox(item, f);
        if (p.x < b.x0 - pad || p.x > b.x1 + pad || p.y < b.y0 - pad || p.y > b.y1 + pad) return;
        var d = Math.abs(p.x - (b.x0 + b.x1) / 2) + Math.abs(p.y - (b.y0 + b.y1) / 2);
        if (d <= bestDist) { bestDist = d; best = item; }       // ties: the one drawn last (on top)
    });
    return best;
}

// Drag target: the accessory under the pointer, else the selected one, else the only one placed.
function chooseDragTarget(p) {
    var hit = pickAccessory(p, true);
    if (hit) return hit;
    var sel = getSelectedItem();
    if (sel) return sel;
    return placed.length === 1 ? placed[0] : null;
}

function nudgeAccessory(ddx, ddy) {
    var item = getSelectedItem();
    if (!item) return;
    item.dx += ddx;
    item.dy += ddy;
}

var nudgeTimer = null;
function startNudge(ddx, ddy) {
    stopNudge();
    nudgeAccessory(ddx, ddy);
    nudgeTimer = setInterval(function() { nudgeAccessory(ddx, ddy); }, 60);
}
function stopNudge() {
    if (nudgeTimer) { clearInterval(nudgeTimer); nudgeTimer = null; }
}
window.addEventListener('pointerup', stopNudge);
window.addEventListener('blur', stopNudge);

function setAccessoryScale(item, s) {
    item.scale = Math.max(0.4, Math.min(2.5, s));
    syncSizeControl();
}

function setupAccessoryInteraction() {
    var c = previewCanvas;
    c.style.touchAction = 'none';

    c.addEventListener('pointerdown', function(ev) {
        if (ev.pointerType === 'mouse') activePointers = {};   // a mouse is a single pointer: drop stale entries
        activePointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
        var ids = Object.keys(activePointers);
        var sel = getSelectedItem();
        if (ids.length === 2 && sel && ev.pointerType !== 'mouse') {          // pinch to resize
            var a = activePointers[ids[0]], b = activePointers[ids[1]];
            dragState = { uid: sel.uid, pinch: true, startDist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), startScale: sel.scale };
            return;
        }
        var p = canvasPoint(ev);
        var item = chooseDragTarget(p);
        if (!item) return;
        var f = getFace(c.width, c.height);
        dragState = { uid: item.uid, startX: p.x, startY: p.y, startDx: item.dx, startDy: item.dy, u: f.w };
        try { c.setPointerCapture(ev.pointerId); } catch (e) { /* not fatal: window listeners still end the drag */ }
        c.style.cursor = 'grabbing';
        if (selectedUid !== item.uid) { selectedUid = item.uid; updateAccessoryControls(); }
        ev.preventDefault();
    });

    c.addEventListener('pointermove', function(ev) {
        if (dragState && ev.pointerType === 'mouse' && ev.buttons === 0) { endPointer(ev); return; }   // lost the button-up
        if (activePointers[ev.pointerId]) activePointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
        var item = dragState ? findItem(dragState.uid) : null;
        if (dragState && dragState.pinch) {
            var ids = Object.keys(activePointers);
            if (item && ids.length >= 2) {
                var a = activePointers[ids[0]], b = activePointers[ids[1]];
                setAccessoryScale(item, dragState.startScale * Math.hypot(a.x - b.x, a.y - b.y) / dragState.startDist);
            }
            return;
        }
        if (dragState && item) {
            var p = canvasPoint(ev);
            item.dx = dragState.startDx + (p.x - dragState.startX) / dragState.u;
            item.dy = dragState.startDy + (p.y - dragState.startY) / dragState.u;
        } else if (ev.pointerType === 'mouse') {
            c.style.cursor = pickAccessory(canvasPoint(ev), false) ? 'grab' : 'default';
        }
    });

    function endPointer(ev) {
        delete activePointers[ev.pointerId];
        if (dragState && (!dragState.pinch || Object.keys(activePointers).length < 2)) dragState = null;
        c.style.cursor = 'default';
    }
    c.addEventListener('pointerup', endPointer);
    c.addEventListener('pointercancel', endPointer);
    window.addEventListener('pointerup', endPointer);      // released outside the canvas
    window.addEventListener('pointercancel', endPointer);

    c.addEventListener('wheel', function(ev) {
        var item = pickAccessory(canvasPoint(ev), true) || getSelectedItem();
        if (!item) return;
        ev.preventDefault();
        if (selectedUid !== item.uid) { selectedUid = item.uid; updateAccessoryControls(); }
        setAccessoryScale(item, item.scale * Math.exp(-ev.deltaY * 0.0015));
    }, { passive: false });

    document.addEventListener('keydown', function(ev) {
        var tag = ev.target && ev.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if ((ev.key === 'Delete' || ev.key === 'Backspace') && selectedUid !== null) {
            ev.preventDefault();
            removeSelected();
        }
    });
}

function renderPlacedList() {
    var box = document.getElementById('placedList');
    box.innerHTML = '';
    placed.forEach(function(item) {
        var m = itemMeta(item);
        var chip = document.createElement('div');
        chip.className = 'chip' + (item.uid === selectedUid ? ' selected' : '');
        var main = document.createElement('button');
        main.type = 'button';
        main.className = 'chip-main';
        main.textContent = m.emoji + ' ' + m.name;
        main.title = 'Seleccionar para mover o cambiar el tamaño';
        main.onclick = function() { selectedUid = item.uid; updateAccessoryControls(); };
        var rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'chip-remove';
        rm.textContent = '✕';
        rm.title = 'Quitar ' + m.name;
        rm.onclick = function() { removeAccessory(item.uid); };
        chip.appendChild(main);
        chip.appendChild(rm);
        box.appendChild(chip);
    });
}

function syncSizeControl() {
    var item = getSelectedItem();
    if (!item) return;
    document.getElementById('sizeLabel').textContent = 'Tamaño: ' + itemMeta(item).name;
    document.getElementById('sizeSlider').value = item.scale;
    document.getElementById('sizeValue').textContent = Math.round(item.scale * 100) + '%';
}

function updateAccessoryControls() {
    var box = document.getElementById('accessoryControls');
    box.style.display = placed.length ? 'block' : 'none';
    if (!placed.length) return;
    renderPlacedList();
    syncSizeControl();
}

function onSizeSlider(v) {
    var item = getSelectedItem();
    if (item) setAccessoryScale(item, parseFloat(v));
}

function resetAccessory() {
    var item = getSelectedItem();
    if (!item) return;
    item.dx = 0; item.dy = 0; item.scale = 1;
    syncSizeControl();
}

// ===== Video layer + filters =====
var FILTERS = {
    sepia: { css: 'sepia(1)', pixel: pixelSepia },
    grayscale: { css: 'grayscale(1)', pixel: pixelGray },
    invert: { css: 'invert(1)', pixel: pixelInvert },
    vintage: { css: 'sepia(0.45) contrast(1.1) saturate(1.25) brightness(0.95)', pixel: pixelVintage },
    warm: { css: 'saturate(1.15)', tint: 'rgba(255,140,30,0.30)' },
    cool: { css: 'saturate(1.05)', tint: 'rgba(30,120,255,0.30)' },
    blur: { css: 'blur(5px)', blur: true },
    halloween: { css: 'contrast(1.2) saturate(1.3) brightness(0.9) sepia(0.25)', tint: 'rgba(255,90,0,0.32)', vignette: 'rgba(40,0,70,0.75)' }
};

var distCanvas = document.createElement('canvas');
var distCtx = distCanvas.getContext('2d', { willReadFrequently: true });

// Remaps vidCanvas through a geometric distortion. Preview works at half resolution for speed.
function applyDistortion(id, w, h, t) {
    if (id === 'pixelate') {
        var pw = Math.max(1, Math.round(w / 28)), ph2 = Math.max(1, Math.round(h / 28));
        distCanvas.width = pw; distCanvas.height = ph2;
        distCtx.drawImage(vidCanvas, 0, 0, pw, ph2);
        vidCtx.imageSmoothingEnabled = false;
        vidCtx.drawImage(distCanvas, 0, 0, pw, ph2, 0, 0, w, h);
        vidCtx.imageSmoothingEnabled = true;
        return;
    }
    var k = renderHQ ? 1 : 0.4;
    var sw = Math.round(w * k), sh = Math.round(h * k);
    if (distCanvas.width !== sw || distCanvas.height !== sh) { distCanvas.width = sw; distCanvas.height = sh; }
    distCtx.drawImage(vidCanvas, 0, 0, sw, sh);
    var sd = distCtx.getImageData(0, 0, sw, sh).data;
    var dst = distCtx.createImageData(sw, sh);
    var dd = dst.data;
    var cx = sw / 2, cy = sh / 2;
    var R = Math.min(sw, sh) * 0.6;
    var phase = t * 0.004;
    var maxX = sw - 1.001, maxY = sh - 1.001;
    for (var y = 0; y < sh; y++) {
        for (var x = 0; x < sw; x++) {
            var sx = x, sy = y, dx = x - cx, dy = y - cy, r, a, c, s;
            switch (id) {
                case 'bulge':
                    r = Math.sqrt(dx * dx + dy * dy) / R;
                    if (r < 1 && r > 0) { var m = Math.pow(r, 0.8); sx = cx + dx * m; sy = cy + dy * m; }
                    break;
                case 'pinch':
                    r = Math.sqrt(dx * dx + dy * dy) / R;
                    if (r < 1 && r > 0.0001) { var m2 = Math.pow(r, -0.45); sx = cx + dx * m2; sy = cy + dy * m2; }
                    break;
                case 'swirl':
                    r = Math.sqrt(dx * dx + dy * dy) / R;
                    if (r < 1) {
                        a = 3.2 * (1 - r) * (1 - r);
                        c = Math.cos(a); s = Math.sin(a);
                        sx = cx + dx * c - dy * s; sy = cy + dx * s + dy * c;
                    }
                    break;
                case 'wave':
                    sx = x + Math.sin(y / sh * Math.PI * 6 + phase) * sw * 0.025;
                    break;
                case 'mirror':
                    if (x > cx) sx = 2 * cx - x;
                    break;
                case 'wide':
                    sx = cx + dx * (0.55 + 0.9 * Math.abs(dy) / cy);
                    break;
                case 'tall':
                    sy = cy + dy * (0.55 + 0.9 * Math.abs(dx) / cx);
                    break;
            }
            if (sx < 0) sx = 0; else if (sx > maxX) sx = maxX;
            if (sy < 0) sy = 0; else if (sy > maxY) sy = maxY;
            var x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0;
            var i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4;

            ctx.beginPath(); ctx.moveTo(cxL + r * 1.05, ey); ctx.lineTo(cxR - r * 1.05, ey); ctx.stroke();
            break;
        case 'swim':
            ctx.strokeStyle = '#0b3d91'; ctx.lineWidth = 0.1 * u;
            ctx.beginPath(); ctx.moveTo(cxL - r * 1.2, ey); ctx.lineTo(f.cx - u * 0.55, ey - r * 0.1);
            ctx.moveTo(cxR + r * 1.2, ey); ctx.lineTo(f.cx + u * 0.55, ey - r * 0.1); ctx.stroke();
            ctx.fillStyle = 'rgba(40,140,255,0.55)';
            ctx.lineWidth = 0.06 * u;
            ctx.beginPath(); ctx.ellipse(cxL, ey, r * 1.15, r * 0.95, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(cxR, ey, r * 1.15, r * 0.95, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cxL + r * 1.1, ey); ctx.lineTo(cxR - r * 1.1, ey); ctx.stroke();
            break;
    }
    ctx.restore();
}

// ===== Backgrounds (scene behind the person) =====
function drawBackground(ctx, w, h, id, t) {
    var rnd = mulberry32(hashStr('bg' + id));
    var sec = t / 1000;
    var g, i, x, y, r;
    ctx.save();
    switch (id) {
        case 'beach':
            g = ctx.createLinearGradient(0, 0, 0, h * 0.6);
            g.addColorStop(0, '#4fb8ff'); g.addColorStop(1, '#bdeaff');

            ctx.fillStyle = '#ffe14d';
            ctx.beginPath(); ctx.arc(w * 0.82, h * 0.16, h * 0.08, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1e90c8'; ctx.fillRect(0, h * 0.5, w, h * 0.2);
            ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
            for (i = 0; i < 5; i++) {
                ctx.beginPath();
                for (x = 0; x <= w; x += 20) {
                    y = h * (0.54 + i * 0.03) + Math.sin(x * 0.02 + sec * 1.5 + i) * 5;
                    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            ctx.fillStyle = '#f2d388'; ctx.fillRect(0, h * 0.7, w, h * 0.3);
            ctx.strokeStyle = '#7a4a1f'; ctx.lineWidth = w * 0.012;
            ctx.beginPath(); ctx.moveTo(w * 0.1, h * 0.9); ctx.quadraticCurveTo(w * 0.14, h * 0.55, w * 0.1, h * 0.3); ctx.stroke();
            ctx.fillStyle = '#2e9e4a';
            for (i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.ellipse(w * 0.1 + Math.cos(i * 1.3) * w * 0.05, h * 0.3 + Math.sin(i * 1.3) * h * 0.04, w * 0.05, h * 0.02, i * 1.3, 0, Math.PI * 2);
                ctx.fill();
            }
            break;
        case 'space':
            g = ctx.createRadialGradient(w * 0.7, h * 0.3, 0, w * 0.5, h * 0.5, w * 0.8);
            g.addColorStop(0, '#3a1c71'); g.addColorStop(0.5, '#150a33'); g.addColorStop(1, '#02010a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            for (i = 0; i < 90; i++) {
                x = rnd() * w; y = rnd() * h; r = rnd() * 2 + 0.5;
                ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.6 * Math.abs(Math.sin(sec * 2 + i))) + ')';
                ctx.beginPath(); ctx.arc(x, y, r * w / 1280, 0, Math.PI * 2); ctx.fill();
            }
            g = ctx.createRadialGradient(w * 0.18, h * 0.25, 0, w * 0.18, h * 0.25, h * 0.14);
            g.addColorStop(0, '#ffb86b'); g.addColorStop(1, '#c2410c');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w * 0.18, h * 0.25, h * 0.14, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,230,180,0.7)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.ellipse(w * 0.18, h * 0.25, h * 0.24, h * 0.06, -0.3, 0, Math.PI * 2); ctx.stroke();
            break;
        case 'city':
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#1b1b4b'); g.addColorStop(0.6, '#8a3a7a'); g.addColorStop(1, '#ff9a5a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            for (i = 0; i < 12; i++) {
                var bw = w * (0.06 + rnd() * 0.06), bh = h * (0.25 + rnd() * 0.4), bx = i * w / 11 - bw / 2;
                ctx.fillStyle = '#12122b';
                ctx.fillRect(bx, h - bh, bw, bh);
                for (var wy = h - bh + 12; wy < h - 14; wy += 22) {
                    for (var wx = bx + 8; wx < bx + bw - 12; wx += 18) {
                        if (rnd() > 0.45) { ctx.fillStyle = '#ffd96b'; ctx.fillRect(wx, wy, 8, 11); }
                    }
                }
            }
            break;
        case 'forest':
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#bfe9a8'); g.addColorStop(1, '#2f7d3a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            for (var layer = 0; layer < 3; layer++) {
                ctx.fillStyle = ['#4f9e4f', '#2f7d3a', '#1b5e2a'][layer];
                for (i = 0; i < 9; i++) {
                    x = (i + rnd() * 0.5) * w / 8; var th = h * (0.35 + layer * 0.1 + rnd() * 0.15), tw = w * 0.1;
                    var base = h * (0.7 + layer * 0.12);
                    ctx.beginPath();
                    ctx.moveTo(x, base - th); ctx.lineTo(x + tw, base); ctx.lineTo(x - tw, base); ctx.closePath(); ctx.fill();
                }
            }
            ctx.fillStyle = '#1b5e2a'; ctx.fillRect(0, h * 0.9, w, h * 0.1);
            break;
        case 'sunset':
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#2b1055'); g.addColorStop(0.45, '#d4418e'); g.addColorStop(0.75, '#ff8a3d'); g.addColorStop(1, '#ffd36b');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff3b0';
            ctx.beginPath(); ctx.arc(w * 0.5, h * 0.68, h * 0.18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2a1233';
            ctx.beginPath(); ctx.moveTo(0, h);
            ctx.lineTo(0, h * 0.78); ctx.lineTo(w * 0.15, h * 0.65); ctx.lineTo(w * 0.3, h * 0.8); ctx.lineTo(w * 0.5, h * 0.7);
            ctx.lineTo(w * 0.7, h * 0.82); ctx.lineTo(w * 0.85, h * 0.66); ctx.lineTo(w, h * 0.78); ctx.lineTo(w, h);
            ctx.closePath(); ctx.fill();
            break;
        case 'party':
            g = ctx.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, '#2a0845'); g.addColorStop(1, '#6a1b9a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'lighter';
            for (i = 0; i < 5; i++) {
                var ang = Math.sin(sec * 0.8 + i * 1.7) * 0.5;
                var bx2 = w * (0.1 + i * 0.2);

                g.addColorStop(0, 'hsla(' + (i * 70 + sec * 40) % 360 + ',100%,60%,0.45)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.save(); ctx.translate(bx2, 0); ctx.rotate(ang);
                ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(w * 0.12, h * 1.1); ctx.lineTo(-w * 0.12, h * 1.1); ctx.closePath(); ctx.fill();
                ctx.restore();
            }
            ctx.globalCompositeOperation = 'source-over';
            for (i = 0; i < 60; i++) {
                x = rnd() * w; y = ((rnd() * h) + sec * (30 + rnd() * 40)) % h;
                ctx.fillStyle = 'hsl(' + Math.floor(rnd() * 360) + ',90%,60%)';
                ctx.save(); ctx.translate(x, y); ctx.rotate(sec * 2 + i); ctx.fillRect(-5, -2, 10, 4); ctx.restore();
            }
            break;
        case 'graveyard':
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#0b0620'); g.addColorStop(0.7, '#3b1c63'); g.addColorStop(1, '#5a2a7a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            g = ctx.createRadialGradient(w * 0.8, h * 0.2, h * 0.08, w * 0.8, h * 0.2, h * 0.3);
            g.addColorStop(0, 'rgba(255,244,194,0.5)'); g.addColorStop(1, 'rgba(255,244,194,0)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff4c2';
            ctx.beginPath(); ctx.arc(w * 0.8, h * 0.2, h * 0.09, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0d0820';
            ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(0, h * 0.8);
            ctx.quadraticCurveTo(w * 0.3, h * 0.7, w * 0.6, h * 0.82); ctx.quadraticCurveTo(w * 0.85, h * 0.74, w, h * 0.8); ctx.lineTo(w, h);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#0d0820'; ctx.lineWidth = w * 0.014; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(w * 0.1, h * 0.85); ctx.quadraticCurveTo(w * 0.12, h * 0.55, w * 0.09, h * 0.3);
            ctx.moveTo(w * 0.105, h * 0.55); ctx.lineTo(w * 0.2, h * 0.4);
            ctx.moveTo(w * 0.1, h * 0.45); ctx.lineTo(w * 0.03, h * 0.33);
            ctx.moveTo(w * 0.095, h * 0.35); ctx.lineTo(w * 0.15, h * 0.22); ctx.stroke();
            [[0.27, 0.78], [0.42, 0.84], [0.6, 0.86], [0.88, 0.84]].forEach(function(tp, k) {
                var tx = w * tp[0], ty = h * tp[1], tw2 = w * 0.05, th = h * 0.13;
                ctx.fillStyle = '#2a2640';
                ctx.beginPath();
                ctx.moveTo(tx - tw2, ty + th); ctx.lineTo(tx - tw2, ty);
                ctx.arc(tx, ty, tw2, Math.PI, 0);
                ctx.lineTo(tx + tw2, ty + th); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
                if (k % 2) { ctx.beginPath(); ctx.moveTo(tx, ty - tw2 * 0.4); ctx.lineTo(tx, ty + th * 0.5); ctx.moveTo(tx - tw2 * 0.4, ty); ctx.lineTo(tx + tw2 * 0.4, ty); ctx.stroke(); }
            });
            ctx.fillStyle = '#ff7a00';
            ctx.beginPath(); ctx.ellipse(w * 0.72, h * 0.9, w * 0.035, h * 0.05, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2e7d32'; ctx.fillRect(w * 0.717, h * 0.84, w * 0.007, h * 0.025);
            break;
        case 'winter':
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#9ac7f0'); g.addColorStop(1, '#e8f6ff');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(0, h);
            ctx.lineTo(0, h * 0.78); ctx.quadraticCurveTo(w * 0.3, h * 0.68, w * 0.55, h * 0.8); ctx.quadraticCurveTo(w * 0.8, h * 0.7, w, h * 0.78); ctx.lineTo(w, h);
            ctx.closePath(); ctx.fill();
            for (i = 0; i < 5; i++) {
                x = w * (0.08 + rnd() * 0.84); y = h * (0.7 + rnd() * 0.1);
                ctx.fillStyle = '#2d6a4f';
                ctx.beginPath(); ctx.moveTo(x, y - h * 0.22); ctx.lineTo(x + w * 0.05, y); ctx.lineTo(x - w * 0.05, y); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.moveTo(x, y - h * 0.22); ctx.lineTo(x + w * 0.02, y - h * 0.14); ctx.lineTo(x - w * 0.02, y - h * 0.14); ctx.closePath(); ctx.fill();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            for (i = 0; i < 70; i++) {
                x = (rnd() * w + Math.sin(sec + i) * 15 + w) % w; y = (rnd() * h + sec * (25 + rnd() * 40)) % h;
                ctx.beginPath(); ctx.arc(x, y, (1.5 + rnd() * 2.5) * w / 1280, 0, Math.PI * 2); ctx.fill();
            }
            break;
    }
    ctx.restore();
}

// ===== Effects (animated overlays) =====
function drawEffect(ctx, w, h, id, t) {
    var s = w / 1280;
    var sec = t / 1000;
    var rnd = mulberry32(hashStr('fx' + id));
    var i, x, y, r, p, g;
    ctx.save();
    switch (id) {
        case 'bokeh':
            ctx.globalCompositeOperation = 'lighter';
            for (i = 0; i < 18; i++) {
                x = ((rnd() + sec * (0.008 + rnd() * 0.015)) % 1) * w;
                y = (rnd() + Math.sin(sec * 0.6 + i) * 0.03) * h;
                r = (20 + rnd() * 50) * s;
                var hue = Math.floor(rnd() * 360);
                g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'hsla(' + hue + ',100%,75%,0.45)');
                g.addColorStop(0.8, 'hsla(' + hue + ',100%,60%,0.2)');
                g.addColorStop(1, 'hsla(' + hue + ',100%,60%,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }
            break;
        case 'sparkles':
            for (i = 0; i < 32; i++) {
                x = rnd() * w; y = rnd() * h;
                var tw = 0.5 + 0.5 * Math.sin(sec * 3 + rnd() * 6.28);
                r = (6 + rnd() * 16) * s * tw;
                fillSparkle(ctx, x, y, r, ['#ffffff', '#ffe66d', '#4ecdc4', '#ff9ecd'][i % 4]);
            }
            break;
        case 'hearts':
            for (i = 0; i < 14; i++) {
                x = (rnd() + Math.sin(sec + i) * 0.02) * w;
                p = (rnd() + sec * (0.06 + rnd() * 0.08)) % 1;
                y = h * (1.1 - p * 1.2);
                fillHeart(ctx, x, y, (14 + rnd() * 22) * s, 'rgba(255,45,100,0.85)');
            }
            break;
        case 'stars':
            for (i = 0; i < 16; i++) {
                x = rnd() * w;
                p = (rnd() + sec * (0.05 + rnd() * 0.07)) % 1;
                y = h * (p * 1.2 - 0.1);
                fillStar(ctx, x, y, (12 + rnd() * 20) * s, sec * (0.5 + rnd()) + i, '#ffd60a');
            }
            break;
        case 'bubbles':
            for (i = 0; i < 24; i++) {
                x = (rnd() + Math.sin(sec * 1.2 + i) * 0.015) * w;
                p = (rnd() + sec * (0.05 + rnd() * 0.08)) % 1;
                y = h * (1.1 - p * 1.2);
                r = (8 + rnd() * 24) * s;
                g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
                g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(140,210,255,0.12)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5 * s;
                ctx.stroke();
            }
            break;
        case 'fireworks':
            ctx.globalCompositeOperation = 'lighter';
            for (var b = 0; b < 4; b++) {
                var period = 2.4, off = b * 0.7 + 0.3;
                var cycle = Math.floor((sec + off) / period);
                p = ((sec + off) % period) / period;
                var r2 = mulberry32(b * 131 + cycle * 977 + 7);
                var cx = (0.15 + r2() * 0.7) * w, cy = (0.12 + r2() * 0.4) * h;
                var hue2 = Math.floor(r2() * 360);
                var ease = 1 - Math.pow(1 - p, 3);
                for (var k = 0; k < 28; k++) {
                    var ang = k / 28 * Math.PI * 2;
                    var dist = ease * (110 + (k % 2) * 40) * s;
                    var px = cx + Math.cos(ang) * dist, py = cy + Math.sin(ang) * dist + p * p * 60 * s;
                    ctx.fillStyle = 'hsla(' + hue2 + ',100%,' + (60 + (k % 2) * 15) + '%,' + (1 - p) + ')';
                    ctx.beginPath(); ctx.arc(px, py, Math.max(0.5, 4 * (1 - p)) * s, 0, Math.PI * 2); ctx.fill();
                }
            }
            break;
        case 'bats':
            ctx.fillStyle = '#120a1f';
            for (i = 0; i < 6; i++) {
                x = (((rnd() + sec * (0.04 + rnd() * 0.06)) % 1.2) - 0.1) * w;
                y = (0.08 + rnd() * 0.5) * h + Math.sin(sec * 2 + i) * 18 * s;
                r = (18 + rnd() * 18) * s;
                var flap = Math.sin(sec * 12 + i * 2) * 0.55;
                ctx.beginPath();
                ctx.moveTo(x, y - r * 0.2);
                ctx.quadraticCurveTo(x + r * 0.6, y - r * (0.9 + flap), x + r * 1.5, y - r * (0.1 + flap));
                ctx.quadraticCurveTo(x + r * 1.1, y + r * 0.1, x + r * 0.8, y + r * 0.1);
                ctx.quadraticCurveTo(x + r * 0.5, y + r * 0.35, x, y + r * 0.45);
                ctx.quadraticCurveTo(x - r * 0.5, y + r * 0.35, x - r * 0.8, y + r * 0.1);
                ctx.quadraticCurveTo(x - r * 1.1, y + r * 0.1, x - r * 1.5, y - r * (0.1 + flap));
                ctx.quadraticCurveTo(x - r * 0.6, y - r * (0.9 + flap), x, y - r * 0.2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x - r * 0.25, y - r * 0.15); ctx.lineTo(x - r * 0.15, y - r * 0.55); ctx.lineTo(x, y - r * 0.2);
                ctx.lineTo(x + r * 0.15, y - r * 0.55); ctx.lineTo(x + r * 0.25, y - r * 0.15);
                ctx.fill();
            }
            break;
        case 'ghosts':
            for (i = 0; i < 4; i++) {
                x = (0.12 + rnd() * 0.76) * w + Math.sin(sec * 0.9 + i * 2) * 30 * s;
                y = (0.15 + rnd() * 0.6) * h + Math.cos(sec * 1.1 + i) * 25 * s;
                r = (28 + rnd() * 26) * s;
                ctx.fillStyle = 'rgba(255,255,255,0.72)';
                ctx.beginPath();
                ctx.arc(x, y, r, Math.PI, 0);
                ctx.lineTo(x + r, y + r * 1.3);
                for (var k2 = 0; k2 < 4; k2++) {
                    var wx = x + r - (k2 + 0.5) * r / 2;
                    ctx.quadraticCurveTo(wx + r * 0.25, y + r * (k2 % 2 ? 1.0 : 1.6), wx - r * 0.25, y + r * 1.3);
                }
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(x - r * 0.35, y - r * 0.1, r * 0.14, 0, Math.PI * 2);
                ctx.arc(x + r * 0.35, y - r * 0.1, r * 0.14, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x, y + r * 0.35, r * 0.14, r * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            break;
        case 'glitch':
            var gr = mulberry32(Math.floor(t / 140) * 7919 + 13);
            for (i = 0; i < 7; i++) {
                y = gr() * h; var sh = (0.015 + gr() * 0.07) * h; var dx = (gr() - 0.5) * 0.14 * w;
                if (gr() > 0.25) ctx.drawImage(ctx.canvas, 0, y, w, sh, dx, y, w, sh);
            }
            ctx.globalCompositeOperation = 'screen';
            for (i = 0; i < 4; i++) {
                y = gr() * h;
                ctx.fillStyle = (i % 2) ? 'rgba(255,0,100,0.22)' : 'rgba(0,255,255,0.22)';
                ctx.fillRect(0, y, w, (0.01 + gr() * 0.03) * h);
            }
            break;
    }
    ctx.restore();
}

// ===== Shape helpers =====
function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// Heart centered at (cx, cy), "size" is the overall width.
function fillHeart(ctx, cx, cy, size, color) {
    var s = size / 2;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.85);
    ctx.bezierCurveTo(cx - s * 1.3, cy + s * 0.1, cx - s * 0.9, cy - s * 0.95, cx, cy - s * 0.35);
    ctx.bezierCurveTo(cx + s * 0.9, cy - s * 0.95, cx + s * 1.3, cy + s * 0.1, cx, cy + s * 0.85);
    ctx.closePath();
    ctx.fill();
}

// 5-point star centered at (cx, cy) with outer radius r.
function fillStar(ctx, cx, cy, r, rot, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
        var rad = (i % 2 === 0) ? r : r * 0.45;
        var a = rot + i * Math.PI / 5 - Math.PI / 2;
        var px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
}

// 4-point twinkle star.
function fillSparkle(ctx, cx, cy, r, color) {
    if (r < 0.5) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.quadraticCurveTo(cx, cy, cx + r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy + r);
    ctx.quadraticCurveTo(cx, cy, cx - r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy - r);
    ctx.fill();
}

// ===== Photo strip UI =====
function createPhotoSlots() {
    var photoStrip = document.getElementById('photoStrip');
    photoStrip.innerHTML = '';
    for (var i = 0; i < PHOTO_COUNT; i++) {
        var slot = document.createElement('div');
        slot.id = 'photoSlot' + i;
        slot.className = 'photo-slot';
        slot.innerHTML = '<span class="slot-number">' + (i + 1) + '</span><img alt="Foto ' + (i + 1) + '"><div class="next-countdown"></div>';
        photoStrip.appendChild(slot);
    }
}

function resetPhotoSlots() {
    for (var i = 0; i < PHOTO_COUNT; i++) {
        var slot = document.getElementById('photoSlot' + i);
        slot.classList.remove('filled', 'next');
        slot.querySelector('img').removeAttribute('src');
        slot.querySelector('.next-countdown').textContent = '';
    }
}

function setSlotPhoto(index, url) {
    var slot = document.getElementById('photoSlot' + index);
    if (!slot) return;
    slot.classList.remove('next');
    slot.querySelector('img').src = url;
    slot.classList.add('filled');
}

function updateStatus(text) {
    var el = document.getElementById('statusText');
    if (el) el.textContent = text;
}

// ===== Props UI =====
function renderTabs() {
    var tabs = document.getElementById('propsTabs');
    tabs.innerHTML = '';
    propCategories.forEach(function(cat) {
        var btn = document.createElement('button');
        btn.className = 'prop-tab' + (cat.key === currentPropTab ? ' active' : '');
        btn.textContent = cat.icon + ' ' + cat.label;
        btn.onclick = function() { switchPropTab(cat.key); };
        tabs.appendChild(btn);
    });
}

function switchPropTab(key) {
    currentPropTab = key;
    renderTabs();
    loadProps();
}

function loadProps() {
    var grid = document.getElementById('propsGrid');
    grid.innerHTML = '';
    var cat = getCategory(currentPropTab);
    var multi = (cat.key === 'hat' || cat.key === 'glasses' || cat.key === 'effect');
    cat.items.forEach(function(prop) {
        var count = 0, on = false;
        if (cat.key === 'hat' || cat.key === 'glasses') {
            count = placed.filter(function(p) { return p.kind === cat.key && p.id === prop.id; }).length;
            on = count > 0;
        } else if (cat.key === 'effect') {
            on = effects.indexOf(prop.id) >= 0;
        } else {
            on = selectedProps[cat.key] === prop.id;
        }
        var isNone = prop.id === 'none';
        var label = (multi && isNone) ? 'Quitar todos' : prop.name;
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'prop-item' + (on && !isNone ? ' selected' : '') + (isNone && !multi && on ? ' selected' : '');
        item.title = multi && !isNone ? (cat.key === 'effect' ? 'Pulsa para activar / desactivar' : 'Pulsa para añadir (puedes poner varios)') : label;
        item.innerHTML = '<span class="prop-emoji">' + prop.emoji + '</span><span class="prop-name">' + label + '</span>' +
            (count > 0 ? '<span class="prop-count">×' + count + '</span>' : '');
        item.onclick = function() { selectProp(prop.id, cat.key); };
        grid.appendChild(item);
    });
}

function selectProp(propId, category) {
    if (category === 'hat' || category === 'glasses') {
        if (propId === 'none') clearAccessories(category); else addAccessory(category, propId);
        return;
    }
    if (category === 'effect') {
        if (propId === 'none') { effects = []; loadProps(); updateSummary(); } else toggleEffect(propId);
        return;
    }
    selectedProps[category] = propId;
    loadProps();
    updateSummary();
}

function updateSummary() {
    var parts = [];
    function meta(cat, id) { return cat.items.filter(function(x) { return x.id === id; })[0]; }
    propCategories.forEach(function(cat) {
        var ids = [];
        if (cat.key === 'hat' || cat.key === 'glasses') ids = placed.filter(function(p) { return p.kind === cat.key; }).map(function(p) { return p.id; });
        else if (cat.key === 'effect') ids = effects.slice();
        else if (selectedProps[cat.key] && selectedProps[cat.key] !== 'none') ids = [selectedProps[cat.key]];
        ids.forEach(function(id) {
            var it = meta(cat, id);
            if (it) parts.push(it.emoji + ' ' + it.name);
        });
    });
    document.getElementById('propsSummary').textContent = parts.length ? parts.join(' · ') : 'Sin accesorios';
}

// ===== Sound =====
var audioCtx = null;
function beep(freq, duration, volume) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* audio not supported */ }
}
function playShutterSound() { beep(1200, 0.12, 0.2); }
function playBeepSound() { beep(800, 0.06, 0.12); }

// ===== Fun emoji =====
// Faces and gestures the user can actually perform in front of the camera.
var poseEmojis = [
    { e: '😀', name: 'Sonrisa' },
    { e: '😁', name: 'Sonrisa enorme' },
    { e: '😮', name: 'Sorpresa' },
    { e: '😱', name: '¡Susto!' },
    { e: '😜', name: 'Guiño con lengua' },
    { e: '😉', name: 'Guiño' },
    { e: '🤪', name: 'Cara de loco' },
    { e: '😘', name: 'Beso' },
    { e: '🥰', name: 'Enamorado' },
    { e: '🤔', name: 'Pensativo' },
    { e: '🤫', name: 'Silencio' },
    { e: '😏', name: 'Pícaro' },
    { e: '😠', name: 'Enfadado' },
    { e: '😭', name: 'Llorando' },
    { e: '😴', name: 'Dormido' },
    { e: '😎', name: 'Chulo' },
    { e: '✌️', name: 'Paz' },
    { e: '👍', name: 'Pulgar arriba' },
    { e: '👌', name: 'Vale' },
    { e: '🤘', name: 'Rock' },
    { e: '🙌', name: 'Manos arriba' },
    { e: '💪', name: 'Fuerte' }
];
var sessionPoses = [];

function pickSessionPoses() {
    var pool = poseEmojis.slice();
    for (var i = pool.length - 1; i > 0; i--) {     // Fisher-Yates shuffle: no repeats within a session
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    sessionPoses = pool.slice(0, PHOTO_COUNT);
}

function showPose(index) {
    var pose = sessionPoses[index];
    var el = document.getElementById('poseBox');
    if (!el) {
        el = document.createElement('div');
        el.id = 'poseBox';
        el.style.cssText = 'position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;text-align:center;';
        document.querySelector('.camera-container').appendChild(el);
    }
    if (!pose) { el.style.display = 'none'; return; }
    el.innerHTML = '<div style="font-size:100px;line-height:1.1;">' + pose.e + '</div>' +
        '<div style="display:inline-block;padding:4px 16px;border-radius:16px;background:rgba(0,0,0,0.6);color:#ffe66d;font-weight:600;font-size:1.2em;">' + pose.name + '</div>';
    el.style.display = 'block';
}

function hidePose() {
    var el = document.getElementById('poseBox');
    if (el) el.style.display = 'none';
}

// Stamps the pose emoji small in the bottom-left corner of a photo canvas.
function stampPose(ctx, w, h, pose) {
    if (!pose) return;
    var size = h * 0.13;
    var margin = h * 0.035;
    var cx = margin + size / 2, cy = h - margin - size / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(cx, cy, size * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = Math.round(size) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(pose.e, cx, cy + size * 0.05);
    ctx.restore();
}

// ===== Modal =====
function showErrorModal(message) {
    document.getElementById('errorMessage').textContent = message;
    document.getElementById('errorModal').classList.add('active');
}

function closeErrorModal() {
    document.getElementById('errorModal').classList.remove('active');
}

function retryCamera() {
    closeErrorModal();
    initializeCamera();
}

// ===== Photo booth session =====
function later(fn, ms) {
    var id = setTimeout(fn, ms);
    sessionTimers.push(id);
    return id;
}

function clearSessionTimers() {
    sessionTimers.forEach(function(id) { clearTimeout(id); clearInterval(id); });
    sessionTimers = [];
}

function countdownTicks(seconds, onTick, onDone) {
    var left = seconds;
    onTick(left);
    var id = setInterval(function() {
        left--;
        if (left <= 0) { clearInterval(id); onDone(); }
        else onTick(left);
    }, 1000);
    sessionTimers.push(id);
}

function startPhotoBooth() {
    if (!stream || !cameraView || cameraView.readyState < 2) {
        showErrorModal('La cámara no está disponible todavía.');
        return;
    }
    if (isSessionRunning) return;
    isSessionRunning = true;
    clearSessionTimers();
    photos.forEach(function(url) { URL.revokeObjectURL(url); });
    photos = [];
    currentPhotoIndex = 0;
    resetPhotoSlots();
    pickSessionPoses();
    showPose(0);
    updateStatus('¡Prepárate! Haz el gesto del emoji');
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('recBadge').classList.add('active');
    document.getElementById('recCount').textContent = '1';
    startInitialCountdown();
}

function startInitialCountdown() {
    var display = document.getElementById('countdownDisplay');
    display.classList.add('active');
    countdownTicks(COUNTDOWN_TIME, function(n) {
        display.textContent = n;
        playBeepSound();
    }, function() {
        display.classList.remove('active');
        takePhoto();
    });
}

function takePhoto() {
    if (!isSessionRunning) return;
    playShutterSound();
    var flash = document.getElementById('flash');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');

    var shotStart = performance.now();
    capturePhoto().then(function() {
        if (!isSessionRunning) return;
        var spent = performance.now() - shotStart;      // keep the rhythm even if capture was slow
        currentPhotoIndex++;
        if (currentPhotoIndex >= PHOTO_COUNT) { endPhotoSession(); return; }
        document.getElementById('recCount').textContent = String(currentPhotoIndex + 1);
        updateStatus('Siguiente foto en ' + TIME_BETWEEN_PHOTOS + '…');
        updateNextPhotoCountdown();
        showPose(currentPhotoIndex);
        later(function() { takePhoto(); }, Math.max(500, TIME_BETWEEN_PHOTOS * 1000 - spent));
    });
}

function capturePhoto() {
    return new Promise(function(resolve) {
        var w = previewCanvas.width, h = previewCanvas.height;
        renderHQ = true;                                    // full-res distortion for the saved photo
        renderFrame(previewCtx, w, h, performance.now(), false);   // same pipeline as the live preview, no guides
        renderHQ = false;
        // Copy so the emoji stamp lands only in the saved photo, not in the live preview.
        var shot = document.createElement('canvas');
        shot.width = w; shot.height = h;
        var sctx = shot.getContext('2d');
        sctx.drawImage(previewCanvas, 0, 0);
        stampPose(sctx, w, h, sessionPoses[currentPhotoIndex]);
        shot.toBlob(function(blob) {
            if (!blob) { resolve(); return; }
            var url = URL.createObjectURL(blob);
            photos.push(url);
            setSlotPhoto(photos.length - 1, url);
            resolve();
        }, 'image/jpeg', 0.92);
    });
}

function updateNextPhotoCountdown() {
    var slot = document.getElementById('photoSlot' + currentPhotoIndex);
    if (!slot) return;
    var el = slot.querySelector('.next-countdown');
    slot.classList.add('next');
    countdownTicks(TIME_BETWEEN_PHOTOS, function(n) {
        el.textContent = n;
        if (n < TIME_BETWEEN_PHOTOS) playBeepSound();
    }, function() {
        slot.classList.remove('next');
    });
}

function endPhotoSession() {
    isSessionRunning = false;
    clearSessionTimers();
    document.getElementById('recBadge').classList.remove('active');
    hidePose();
    updateStatus('Procesando fotos…');
    later(function() {
        downloadPhotoStrip().then(function() {
            document.getElementById('startBtn').style.display = '';
            updateStatus('¡Tira guardada! Listo para otra ronda');
        });
    }, 500);
}

function stopPhotoBooth() {
    isSessionRunning = false;
    clearSessionTimers();
    document.getElementById('countdownDisplay').classList.remove('active');
    document.getElementById('recBadge').classList.remove('active');
    document.getElementById('startBtn').style.display = '';
    hidePose();
    updateStatus('Sesión detenida');
}

// ===== Download strip =====
function loadImage(url) {
    return new Promise(function(resolve, reject) {
        var img = new Image();
        img.onload = function() { resolve(img); };
        img.onerror = reject;
        img.src = url;
    });
}

function downloadPhotoStrip() {
    if (photos.length === 0) return Promise.resolve();
    updateStatus('Generando tira de fotos…');

    var photoWidth = 400, photoHeight = 300;
    var margin = photoWidth * 0.05;
    var spacing = photoWidth * 0.025;
    var footer = 56;
    var totalWidth = photoWidth + 2 * margin;
    var totalHeight = margin + PHOTO_COUNT * photoHeight + (PHOTO_COUNT - 1) * spacing + footer;

    var stripCanvas = document.createElement('canvas');
    stripCanvas.width = totalWidth;
    stripCanvas.height = totalHeight;
    var ctx = stripCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, totalWidth, totalHeight);

    return Promise.all(photos.map(loadImage)).then(function(images) {
        images.forEach(function(img, i) {
            var y = margin + i * (photoHeight + spacing);
            // cover-crop to 4:3
            var targetRatio = photoWidth / photoHeight;
            var sw = img.width, sh = img.height;
            if (sw / sh > targetRatio) sw = sh * targetRatio; else sh = sw / targetRatio;
            ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, margin, y, photoWidth, photoHeight);
        });
        ctx.fillStyle = '#14142b';
        ctx.textAlign = 'center';
        ctx.font = '700 22px "Fredoka", "Segoe UI", sans-serif';
        ctx.fillText('FOTOMATÓN', totalWidth / 2, totalHeight - 28);
        ctx.fillStyle = '#777';
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.fillText(new Date().toLocaleDateString('es-ES'), totalWidth / 2, totalHeight - 10);

        return new Promise(function(resolve) {
            stripCanvas.toBlob(function(blob) {
                if (blob) {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'fotomaton-tira-' + Date.now() + '.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
                }
                resolve();
            }, 'image/jpeg', 0.92);
        });
    }).catch(function() {
        updateStatus('No se pudo generar la tira');
    });
}
