<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotomatón - 4 Fotos</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #1a1a2e;
            --light: #f7fff7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #292f36 100%);
            min-height: 100vh;
            color: var(--light);
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            grid-template-rows: auto 1fr auto auto;
            grid-template-areas: 
                "header header header"
                "photo-strip camera props"
                "countdown countdown countdown"
                "start-btn start-btn start-btn";
        }

        header {
            grid-area: header;
            text-align: center;
            padding: 15px 0;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8em;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            color: var(--accent);
        }

        /* Camera Section - Center */
        .camera-container {
            grid-area: camera;
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.1);
        }

        .camera-frame {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px dashed var(--accent);
            border-radius: 10px;
            pointer-events: none;
        }

        /* Photo Strip - Left */
        .photo-strip-container {
            grid-area: photo-strip;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 2px solid var(--secondary);
            height: 100%;
            overflow: hidden;
        }

        .photo-strip {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }

        .photo-slot {
            flex: 1;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-slot .slot-number {
            font-size: 1.5em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: bold;
        }

        .photo-slot.filled {
            border-color: var(--secondary);
            background: rgba(84, 160, 255, 0.1);
        }

        .photo-slot .next-countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            display: none;
        }

        .photo-slot.next .next-countdown {
            display: block;
        }

        /* Props Section - Right */
        .props-section {
            grid-area: props;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-left: 2px solid var(--secondary);
            height: 100%;
            overflow-y: auto;
        }

        .props-section h2 {
            text-align: center;
            margin-bottom: 15px;
            color: var(--secondary);
            font-size: 1.3em;
        }

        .props-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .prop-tab {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9em;
        }

        .prop-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 230, 109, 0.1);
        }

        .prop-tab.active {
            border-color: var(--accent);
            color: var(--dark);
            background: var(--accent);
        }

        .props-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }

        .prop-item {
            aspect-ratio: 1;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .prop-item:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 230, 109, 0.3);
        }

        .prop-item.selected {
            border-color: var(--secondary);
            box-shadow: 0 0 20px rgba(84, 160, 255, 0.5);
            transform: scale(1.02);
        }

        .prop-item .prop-emoji {
            font-size: 2em;
            text-align: center;
            line-height: 100%;
            padding: 20px 0;
        }

        .prop-item .prop-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px;
            text-align: center;
            font-size: 0.7em;
            font-weight: bold;
            color: white;
        }

        /* Start Button - Over Camera */
        .start-btn-container {
            grid-area: camera;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .start-btn-container .btn {
            pointer-events: auto;
            width: 400px;
            height: 100px;
            border-radius: 15px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, var(--primary), #ff8e8e);
            color: white;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Countdown - Inside Camera */
        .countdown-container {
            grid-area: camera;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .countdown-display {
            font-size: 5em;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
            animation: bounce 1s ease infinite;
            display: none;
            width: 75%;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
        }

        .countdown-display.active {
            display: block;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Status */
        .status-container {
            grid-area: start-btn;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .status-text {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            font-size: 1.2em;
            padding: 10px 0;
        }

        /* Confetti Effect */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        .confetti-container.active {
            display: block;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* Error Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--dark);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .modal p {
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* Full HD Layout */
        @media (min-width: 1920px) and (min-height: 1080px) {
            body {
                grid-template-columns: 300px 1fr 300px;
            }
            
            .photo-slot {
                min-height: 0;
            }
        }

        /* Responsive for smaller screens */
        @media (max-width: 1200px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto auto;
                grid-template-areas:
                    "header"
                    "photo-strip"
                    "camera"
                    "countdown"
                    "start-btn";
            }

            .photo-strip-container {
                border-right: none;
                border-bottom: 2px solid var(--secondary);
                height: auto;
            }

            .photo-strip {
                flex-direction: row;
                height: auto;
                overflow-x: auto;
            }

            .props-section {
                border-left: none;
                border-top: 2px solid var(--secondary);
                grid-area: props;
            }

            .camera-container {
                min-height: 400px;
            }

            .countdown-display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <h3>Error de Camara</h3>
            <p id="errorMessage">No se pudo acceder a la camara.</p>
            <div class="modal-actions">
                <button class="btn" onclick="closeErrorModal()">Reintentar</button>
                <button class="btn" onclick="closeErrorModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <header>
        <h1>Fotomatón</h1>
    </header>

    <div class="photo-strip-container">
        <div class="photo-strip" id="photoStrip"></div>
    </div>

    <div class="camera-container">
        <video id="cameraView" autoplay playsinline></video>
        <div class="camera-overlay"></div>
        <div class="camera-frame"></div>
        <canvas id="compositeCanvas" style="display: none;"></canvas>
        <div class="countdown-container">
            <div class="countdown-display" id="countdownDisplay"></div>
        </div>
        <div class="start-btn-container">
            <button class="btn" id="startBtn" onclick="startPhotoBooth()">
                <span id="startBtnText">Empezar</span>
            </button>
        </div>
    </div>

    <div class="props-section">
        <h2>Accesorios</h2>
        <div class="props-tabs">
            <button class="prop-tab active" onclick="switchPropTab('filters')">Filtros</button>
            <button class="prop-tab" onclick="switchPropTab('hats')">Sombreros</button>
            <button class="prop-tab" onclick="switchPropTab('glasses')">Gafas</button>
            <button class="prop-tab" onclick="switchPropTab('backgrounds')">Fondos</button>
            <button class="prop-tab" onclick="switchPropTab('effects')">Efectos</button>
        </div>
        <div class="props-grid" id="propsGrid"></div>
    </div>

    <div class="status-container">
        <div class="status-text" id="statusText">Listo para empezar</div>
    </div>

    <script>
// ===== Configuration =====
const PHOTO_COUNT = 4;
const TIME_BETWEEN_PHOTOS = 3;
const COUNTDOWN_TIME = 3;

// ===== Global State =====
let stream = null;
let cameraView = null;
let compositeCanvas = null;
let compositeCtx = null;
let photos = [];
let currentPhotoIndex = 0;
let isSessionRunning = false;
let isCountingDown = false;
let countdownTimeout = null;
let photoTimeout = null;
let betweenPhotosTimeout = null;
let selectedProps = { filter: null, hat: null, glasses: null, background: null, effect: null };
let currentPropTab = 'filters';
let countdownIntervals = [];

// ===== Prop Definitions =====
const propsData = {
    filters: [
        { id: 'none', name: 'Normal', emoji: '\ud83d\udcf8', type: 'filter' },
        { id: 'sepia', name: 'Sepia', emoji: '\ud83d\udf8a', type: 'filter' },
        { id: 'grayscale', name: 'B/N', emoji: '\u26aa', type: 'filter' },
        { id: 'invert', name: 'Negativo', emoji: '\ud83d\udd33', type: 'filter' },
        { id: 'vintage', name: 'Vintage', emoji: '\ud83d\udcfc', type: 'filter' },
        { id: 'warm', name: 'Calido', emoji: '\ud83d\udd25', type: 'filter' },
        { id: 'cool', name: 'Frio', emoji: '\u2744\ufe0f', type: 'filter' },
        { id: 'blur', name: 'Desenfocado', emoji: '\ud83d\udcab', type: 'filter' }
    ],
    hats: [
        { id: 'none', name: 'Ninguno', emoji: '\u2b1c', type: 'hat' },
        { id: 'cowboy', name: 'Vaquero', emoji: '\ud83e\udd20', type: 'hat' },
        { id: 'crown', name: 'Corona', emoji: '\ud83d\udc51', type: 'hat' },
        { id: 'santa', name: 'Santa', emoji: '\ud83c\udf85', type: 'hat' },
        { id: 'party', name: 'Fiesta', emoji: '\ud83c\udf89', type: 'hat' },
        { id: 'chef', name: 'Chef', emoji: '\ud83d\udc69\u200d\ud83c\udf73', type: 'hat' },
        { id: 'pirate', name: 'Pirata', emoji: '\u2620\ufe0f', type: 'hat' },
        { id: 'graduation', name: 'Graduacion', emoji: '\ud83c\udf93\ufe0f', type: 'hat' }
    ],
    glasses: [
        { id: 'none', name: 'Ninguno', emoji: '\u2b1c', type: 'glasses' },
        { id: 'sunglasses', name: 'Sol', emoji: '\ud83d\ude0e', type: 'glasses' },
        { id: 'nerd', name: 'Nerd', emoji: '\ud83d\udc53', type: 'glasses' },
        { id: 'heart', name: 'Corazones', emoji: '\ud83d\udc95', type: 'glasses' },
        { id: 'star', name: 'Estrellas', emoji: '\u2b50', type: 'glasses' },
        { id: '3d', name: '3D', emoji: '\ud83d\udc52', type: 'glasses' },
        { id: 'monocle', name: 'Monoculo', emoji: '\ud83e\udde0', type: 'glasses' },
        { id: 'swim', name: 'Natacion', emoji: '\ud83e\udc7f', type: 'glasses' }
    ],
    backgrounds: [
        { id: 'none', name: 'Ninguno', emoji: '\u2b1c', type: 'background' },
        { id: 'beach', name: 'Playa', emoji: '\ud83c\udf76\ufe0f', type: 'background' },
        { id: 'space', name: 'Espacio', emoji: '\ud83d\ude80', type: 'background' },
        { id: 'city', name: 'Ciudad', emoji: '\ud83c\udf99\ufe0f', type: 'background' },
        { id: 'forest', name: 'Bosque', emoji: '\ud83c\udf32', type: 'background' },
        { id: 'sunset', name: 'Atardecer', emoji: '\ud83c\udf05', type: 'background' },
        { id: 'party', name: 'Fiesta', emoji: '\ud83c\udf89', type: 'background' },
        { id: 'winter', name: 'Invierno', emoji: '\u2744\ufe0f', type: 'background' }
    ],
    effects: [
        { id: 'none', name: 'Ninguno', emoji: '\u2728', type: 'effect' },
        { id: 'bokeh', name: 'Bokeh', emoji: '\ud83d\udcab', type: 'effect' },
        { id: 'sparkles', name: 'Destellos', emoji: '\u2728', type: 'effect' },
        { id: 'hearts', name: 'Corazones', emoji: '\ud83d\udc96', type: 'effect' },
        { id: 'stars', name: 'Estrellas', emoji: '\u2b50', type: 'effect' },
        { id: 'bubbles', name: 'Burbujas', emoji: '\ud83d\udcae', type: 'effect' },
        { id: 'fireworks', name: 'Fuegos', emoji: '\ud83c\udf86', type: 'effect' },
        { id: 'glitch', name: 'Glitch', emoji: '\ud83d\udcbb', type: 'effect' }
    ]
};

const backgroundColors = { none: '#000000', beach: '#87CEEB', space: '#000000', city: '#2F4F4F', forest: '#228B22', sunset: '#FF8C00', party: '#FF69B4', winter: '#E0F7FA' };

// ===== Initialization =====
document.addEventListener('DOMContentLoaded', function() {
    cameraView = document.getElementById('cameraView');
    compositeCanvas = document.getElementById('compositeCanvas');
    compositeCtx = compositeCanvas.getContext('2d');
    createPhotoSlots();
    loadProps();
    initializeCamera();
});

// ===== Camera Functions =====
async function initializeCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
            audio: false
        });
        cameraView.srcObject = stream;
        updateStatus('Camara lista');
    } catch (error) {
        showErrorModal('Error: ' + error.message);
    }
}

function stopCamera() {
    if (stream) { stream.getTracks().forEach(function(track) { track.stop(); }); stream = null; }
}

// ===== UI Functions =====
function createPhotoSlots() {
    var photoStrip = document.getElementById('photoStrip');
    photoStrip.innerHTML = '';
    for (var i = 0; i < PHOTO_COUNT; i++) {
        var slot = document.createElement('div');
        slot.id = 'photoSlot' + i;
        slot.className = 'photo-slot';
        var number = document.createElement('div');
        number.className = 'slot-number';
        number.textContent = i + 1;
        slot.appendChild(number);
        var countdownEl = document.createElement('div');
        countdownEl.className = 'next-countdown';
        countdownEl.textContent = '';
        slot.appendChild(countdownEl);
        photoStrip.appendChild(slot);
    }
}

function updatePhotoStrip() {
    var slots = document.querySelectorAll('.photo-slot');
    slots.forEach(function(slot, index) {
        var countdownEl = slot.querySelector('.next-countdown');
        if (countdownEl) {
            countdownEl.style.display = 'none';
        }
        slot.classList.remove('filled', 'next');
        if (index < photos.length) {
            slot.classList.add('filled');
            var img = slot.querySelector('img');
            if (!img) {
                img = document.createElement('img');
                slot.innerHTML = '';
                slot.appendChild(img);
            }
            img.src = photos[index];
        } else if (index === photos.length && photos.length < PHOTO_COUNT) {
            var number = document.createElement('div');
            number.className = 'slot-number';
            number.textContent = index + 1;
            slot.innerHTML = '';
            slot.appendChild(number);
            var countdownEl = document.createElement('div');
            countdownEl.className = 'next-countdown';
            slot.appendChild(countdownEl);
        } else {
            var number = document.createElement('div');
            number.className = 'slot-number';
            number.textContent = index + 1;
            slot.innerHTML = '';
            slot.appendChild(number);
            var countdownEl = document.createElement('div');
            countdownEl.className = 'next-countdown';
            slot.appendChild(countdownEl);
        }
    });
}

function updateStatus(text) {
    var statusEl = document.getElementById('statusText');
    if (statusEl) statusEl.textContent = text;
}

function switchPropTab(tabName) {
    currentPropTab = tabName;
    loadProps();
    document.querySelectorAll('.prop-tab').forEach(function(tab) {
        tab.classList.remove('active');
    });
    document.querySelector('.prop-tab:nth-child(' + (Object.keys(propsData).indexOf(tabName) + 1) + ')').classList.add('active');
}

function loadProps() {
    var propsGrid = document.getElementById('propsGrid');
    propsGrid.innerHTML = '';
    var props = propsData[currentPropTab];
    props.forEach(function(prop) {
        var propItem = document.createElement('div');
        propItem.className = 'prop-item';
        if (selectedProps[currentPropTab] === prop.id) {
            propItem.classList.add('selected');
        }
        propItem.innerHTML = '<div class="prop-emoji">' + prop.emoji + '</div><div class="prop-name">' + prop.name + '</div>';
        propItem.onclick = function() {
            selectProp(prop.id, currentPropTab);
        };
        propsGrid.appendChild(propItem);
    });
}

function selectProp(propId, category) {
    selectedProps[category] = propId;
    loadProps();
}

// ===== Sound Functions =====
function playShutterSound() {
    try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.value = 1000;
        gainNode.gain.value = 0.1;
        oscillator.start();
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        oscillator.stop(audioCtx.currentTime + 0.1);
    } catch (e) {
        console.log('Audio not supported');
    }
}

function playBeepSound() {
    try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.value = 800;
        gainNode.gain.value = 0.1;
        oscillator.start();
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
        oscillator.stop(audioCtx.currentTime + 0.05);
    } catch (e) {
        console.log('Audio not supported');
    }
}

// ===== Filter Functions =====
function applyFilter(ctx, width, height, filterId) {
    var imageData = ctx.getImageData(0, 0, width, height);
    var data = imageData.data;
    switch (filterId) {
        case 'sepia':
            for (var i = 0; i < data.length; i += 4) {
                var r = data[i], g = data[i + 1], b = data[i + 2];
                data[i] = Math.min(255, (r * 0.393 + g * 0.769 + b * 0.189));
                data[i + 1] = Math.min(255, (r * 0.349 + g * 0.686 + b * 0.168));
                data[i + 2] = Math.min(255, (r * 0.272 + g * 0.534 + b * 0.131));
            }
            break;
        case 'grayscale':
            for (var i = 0; i < data.length; i += 4) {
                var avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                data[i] = data[i + 1] = data[i + 2] = avg;
            }
            break;
        case 'invert':
            for (var i = 0; i < data.length; i += 4) {
                data[i] = 255 - data[i];
                data[i + 1] = 255 - data[i + 1];
                data[i + 2] = 255 - data[i + 2];
            }
            break;
        case 'vintage':
            for (var i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * 1.1);
                data[i + 1] = Math.min(255, data[i + 1] * 0.9);
                data[i + 2] = Math.min(255, data[i + 2] * 0.8);
            }
            break;
        case 'warm':
            for (var i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * 1.1);
                data[i + 2] = Math.min(255, data[i + 2] * 0.9);
            }
            break;
        case 'cool':
            for (var i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * 0.9);
                data[i + 2] = Math.min(255, data[i + 2] * 1.1);
            }
            break;
        case 'blur':
            ctx.filter = 'blur(3px)';
            ctx.drawImage(cameraView, 0, 0, width, height);
            ctx.filter = 'none';
            return;
    }
    ctx.putImageData(imageData, 0, 0);
}

// ===== Hat Drawing Functions =====
function applyHat(ctx, width, height, hatId) {
    var faceWidth = width * 0.6;
    var faceHeight = height * 0.6;
    var faceX = (width - faceWidth) / 2;
    var faceY = (height - faceHeight) / 2;
    ctx.save();
    switch (hatId) {
        case 'cowboy':
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.2, faceWidth * 0.4, faceHeight * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.25, faceWidth * 0.35, faceHeight * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'crown':
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.moveTo(faceX + faceWidth * 0.2, faceY - faceHeight * 0.2);
            ctx.lineTo(faceX + faceWidth * 0.3, faceY - faceHeight * 0.35);
            ctx.lineTo(faceX + faceWidth * 0.4, faceY - faceHeight * 0.25);
            ctx.lineTo(faceX + faceWidth * 0.5, faceY - faceHeight * 0.3);
            ctx.lineTo(faceX + faceWidth * 0.6, faceY - faceHeight * 0.25);
            ctx.lineTo(faceX + faceWidth * 0.7, faceY - faceHeight * 0.35);
            ctx.lineTo(faceX + faceWidth * 0.8, faceY - faceHeight * 0.2);
            ctx.closePath();
            ctx.fill();
            break;
        case 'santa':
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.25, faceWidth * 0.35, faceHeight * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.3, faceWidth * 0.3, faceHeight * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'party':
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.moveTo(faceX + faceWidth * 0.5, faceY - faceHeight * 0.3);
            ctx.lineTo(faceX + faceWidth * 0.3, faceY - faceHeight * 0.2);
            ctx.lineTo(faceX + faceWidth * 0.7, faceY - faceHeight * 0.2);
            ctx.closePath();
            ctx.fill();
            break;
        case 'chef':
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.25, faceWidth * 0.3, faceHeight * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.28, faceWidth * 0.25, faceHeight * 0.05, 0, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'pirate':
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.25, faceWidth * 0.35, faceHeight * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth / 2, faceY - faceHeight * 0.28, faceWidth * 0.08, faceHeight * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'graduation':
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.rect(faceX + faceWidth * 0.3, faceY - faceHeight * 0.35, faceWidth * 0.4, faceHeight * 0.05);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(faceX + faceWidth * 0.35, faceY - faceHeight * 0.4, faceWidth * 0.3, faceHeight * 0.15);
            ctx.fill();
            break;
    }
    ctx.restore();
}

// ===== Glasses Drawing Functions =====
function applyGlasses(ctx, width, height, glassesId) {
    var faceWidth = width * 0.6;
    var faceHeight = height * 0.6;
    var faceX = (width - faceWidth) / 2;
    var faceY = (height - faceHeight) / 2;
    ctx.save();
    switch (glassesId) {
        case 'sunglasses':
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.15, faceHeight * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.65, faceY + faceHeight * 0.05, faceWidth * 0.15, faceHeight * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.3, faceHeight * 0.03);
            ctx.fill();
            break;
        case 'nerd':
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.12, faceHeight * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.65, faceY + faceHeight * 0.05, faceWidth * 0.12, faceHeight * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.3, faceHeight * 0.02);
            ctx.fill();
            break;
        case 'heart':
            drawHeart(ctx, faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.1, faceHeight * 0.1, '#FF0000');
            drawHeart(ctx, faceX + faceWidth * 0.65, faceY + faceHeight * 0.05, faceWidth * 0.1, faceHeight * 0.1, '#FF0000');
            break;
        case 'star':
            drawStar(ctx, faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.1, faceHeight * 0.1, '#FFFF00');
            drawStar(ctx, faceX + faceWidth * 0.65, faceY + faceHeight * 0.05, faceWidth * 0.1, faceHeight * 0.1, '#FFFF00');
            break;
        case '3d':
            ctx.fillStyle = '#0000FF';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.12, faceHeight * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.65, faceY + faceHeight * 0.05, faceWidth * 0.12, faceHeight * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'monocle':
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.6, faceY + faceHeight * 0.05, faceWidth * 0.1, faceHeight * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            break;
        case 'swim':
            ctx.fillStyle = 'rgba(0, 100, 200, 0.7)';
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.18, faceHeight * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(faceX + faceWidth * 0.65, faceY + faceHeight * 0.05, faceWidth * 0.18, faceHeight * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(faceX + faceWidth * 0.35, faceY + faceHeight * 0.05, faceWidth * 0.3, faceHeight * 0.02);
            ctx.fill();
            break;
    }
    ctx.restore();
}

// ===== Effect Functions =====
function applyEffect(ctx, width, height, effectId) {
    switch (effectId) {
        case 'bokeh':
            for (var i = 0; i < 20; i++) {
                var x = Math.random() * width;
                var y = Math.random() * height;
                var size = Math.random() * 10 + 5;
                var opacity = Math.random() * 0.5 + 0.3;
                ctx.fillStyle = 'rgba(255, 255, 255, ' + opacity + ')';
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            break;
        case 'sparkles':
            for (var i = 0; i < 30; i++) {
                var x = Math.random() * width;
                var y = Math.random() * height;
                var size = Math.random() * 3 + 1;
                ctx.fillStyle = ['#FFFFFF', '#FFD700', '#4ecdc4', '#ffe66d'][Math.floor(Math.random() * 4)];
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            break;
        case 'hearts':
            for (var i = 0; i < 15; i++) {
                var x = Math.random() * width;
                var y = Math.random() * height;
                var size = Math.random() * 15 + 10;
                drawHeart(ctx, x, y, size, size, '#FF0000');
            }
            break;
        case 'stars':
            for (var i = 0; i < 15; i++) {
                var x = Math.random() * width;
                var y = Math.random() * height;
                var size = Math.random() * 15 + 10;
                drawStar(ctx, x, y, size, size, '#FFFF00');
            }
            break;
        case 'bubbles':
            for (var i = 0; i < 25; i++) {
                var x = Math.random() * width;
                var y = Math.random() * height;
                var size = Math.random() * 15 + 5;
                var opacity = Math.random() * 0.4 + 0.2;
                ctx.strokeStyle = 'rgba(255, 255, 255, ' + opacity + ')';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.stroke();
            }
            break;
        case 'fireworks':
            for (var i = 0; i < 5; i++) {
                var centerX = Math.random() * width;
                var centerY = Math.random() * height;
                for (var j = 0; j < 15; j++) {
                    var angle = Math.random() * Math.PI * 2;
                    var distance = Math.random() * 50 + 20;
                    var x = centerX + Math.cos(angle) * distance;
                    var y = centerY + Math.sin(angle) * distance;
                    var size = Math.random() * 3 + 1;
                    ctx.fillStyle = ['#FF0000', '#FFFF00', '#00FF00', '#00FFFF', '#FF00FF'][Math.floor(Math.random() * 5)];
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            break;
        case 'glitch':
            var imageData = ctx.getImageData(0, 0, width, height);
            var data = imageData.data;
            for (var i = 0; i < data.length; i += 4) {
                if (Math.random() > 0.95) {
                    var offset = Math.floor(Math.random() * 20) - 10;
                    if (i + offset >= 0 && i + offset < data.length) {
                        data[i] = data[i + offset];
                        data[i + 1] = data[i + offset + 1];
                        data[i + 2] = data[i + offset + 2];
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
            break;
    }
}

// ===== Helper Drawing Functions =====
function drawHeart(ctx, x, y, width, height, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    var centerX = x + width / 2;
    var centerY = y + height / 2;
    ctx.moveTo(centerX, centerY - height / 2);
    ctx.bezierCurveTo(
        centerX + width / 2, centerY - height / 2,
        centerX + width / 2, centerY,
        centerX, centerY + height / 2
    );
    ctx.bezierCurveTo(
        centerX - width / 2, centerY,
        centerX - width / 2, centerY - height / 2,
        centerX, centerY - height / 2
    );
    ctx.closePath();
    ctx.fill();
}

function drawStar(ctx, x, y, width, height, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    var centerX = x + width / 2;
    var centerY = y + height / 2;
    var outerRadius = width / 2;
    var innerRadius = width / 4;
    for (var i = 0; i < 5; i++) {
        var outerAngle = (i * 2 * Math.PI / 5) - Math.PI / 2;
        var innerAngle = ((i + 0.5) * 2 * Math.PI / 5) - Math.PI / 2;
        var outerX = centerX + Math.cos(outerAngle) * outerRadius;
        var outerY = centerY + Math.sin(outerAngle) * outerRadius;
        var innerX = centerX + Math.cos(innerAngle) * innerRadius;
        var innerY = centerY + Math.sin(innerAngle) * innerRadius;
        if (i === 0) {
            ctx.moveTo(outerX, outerY);
        } else {
            ctx.lineTo(outerX, outerY);
        }
        ctx.lineTo(innerX, innerY);
    }
    ctx.closePath();
    ctx.fill();
}

// ===== Photo Booth Functions =====
function startPhotoBooth() {
    if (!stream) { showErrorModal('Camara no disponible.'); return; }
    if (isSessionRunning) return;
    isSessionRunning = true; photos = []; currentPhotoIndex = 0;
    updateStatus('Preparate!');
    document.getElementById('startBtn').style.display = 'none';
    startInitialCountdown();
}

function startInitialCountdown() {
    if (isCountingDown) return;
    isCountingDown = true; let countdown = COUNTDOWN_TIME;
    var countdownDisplay = document.getElementById('countdownDisplay');
    countdownDisplay.classList.add('active');
    countdownDisplay.textContent = countdown;
    
    var countdownInterval = setInterval(function() {
        countdown--;
        countdownDisplay.textContent = countdown;
        if (countdown <= 0) {
            clearInterval(countdownInterval);
            countdownDisplay.classList.remove('active');
            isCountingDown = false;
            takePhoto();
        }
    }, 1000);
}

function takePhoto() {
    if (!stream || !isSessionRunning) return;
    playShutterSound();
    capturePhoto().then(function() {
        currentPhotoIndex++;
        if (currentPhotoIndex >= PHOTO_COUNT) { endPhotoSession(); return; }
        updateNextPhotoCountdown();
        showRandomEmoji();
        betweenPhotosTimeout = setTimeout(function() { 
            playBeepSound(); 
            takePhoto(); 
        }, TIME_BETWEEN_PHOTOS * 1000);
    });
}

async function capturePhoto() {
    return new Promise(function(resolve) {
        var tempCanvas = document.createElement('canvas');
        var tempCtx = tempCanvas.getContext('2d');
        var videoWidth = cameraView.videoWidth;
        var videoHeight = cameraView.videoHeight;
        tempCanvas.width = videoWidth; tempCanvas.height = videoHeight;
        tempCtx.drawImage(cameraView, 0, 0, videoWidth, videoHeight);
        applyPropsToImage(tempCanvas, tempCtx);
        tempCanvas.toBlob(function(blob) {
            var photoUrl = URL.createObjectURL(blob);
            photos.push(photoUrl); 
            updatePhotoStrip(); 
            triggerConfetti(); 
            resolve();
        }, 'image/jpeg', 0.92);
    });
}

function applyPropsToImage(canvas, ctx) {
    var width = canvas.width; var height = canvas.height;
    if (selectedProps.background && selectedProps.background !== 'none') {
        ctx.fillStyle = backgroundColors[selectedProps.background] || '#000000';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(cameraView, 0, 0, width, height);
    }
    if (selectedProps.filter && selectedProps.filter !== 'none') applyFilter(ctx, width, height, selectedProps.filter);
    if (selectedProps.hat && selectedProps.hat !== 'none') applyHat(ctx, width, height, selectedProps.hat);
    if (selectedProps.glasses && selectedProps.glasses !== 'none') applyGlasses(ctx, width, height, selectedProps.glasses);
    if (selectedProps.effect && selectedProps.effect !== 'none') applyEffect(ctx, width, height, selectedProps.effect);
}

function updateNextPhotoCountdown() {
    document.querySelectorAll('.next-countdown').forEach(function(el) { el.style.display = 'none'; });
    document.querySelectorAll('.photo-slot').forEach(function(slot) { slot.classList.remove('next'); });
    var nextSlot = document.getElementById('photoSlot' + currentPhotoIndex);
    if (nextSlot) {
        var countdownEl = nextSlot.querySelector('.next-countdown');
        if (!countdownEl) {
            countdownEl = document.createElement('div');
            countdownEl.className = 'next-countdown';
            nextSlot.appendChild(countdownEl);
        }
        countdownEl.textContent = TIME_BETWEEN_PHOTOS;
        countdownEl.style.display = 'block';
        nextSlot.classList.add('next');
        var countdown = TIME_BETWEEN_PHOTOS;
        var countdownInterval = setInterval(function() {
            countdown--;
            if (countdownEl) countdownEl.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                if (countdownEl) countdownEl.style.display = 'none';
                nextSlot.classList.remove('next');
            }
        }, 1000);
    }
}

function endPhotoSession() {
    isSessionRunning = false;
    if (countdownTimeout) clearTimeout(countdownTimeout);
    if (photoTimeout) clearTimeout(photoTimeout);
    if (betweenPhotosTimeout) clearTimeout(betweenPhotosTimeout);
    updateStatus('Procesando fotos...');
    setTimeout(function() { 
        downloadPhotoStrip();
        document.getElementById('startBtn').style.display = 'block';
        updateStatus('Listo para empezar');
    }, 500);
}

function stopPhotoBooth() {
    if (!isSessionRunning) return;
    isSessionRunning = false;
    if (countdownTimeout) clearTimeout(countdownTimeout);
    if (photoTimeout) clearTimeout(photoTimeout);
    if (betweenPhotosTimeout) clearTimeout(betweenPhotosTimeout);
    document.getElementById('startBtn').style.display = 'block';
    updateStatus('Sesion detenida');
}

// ===== Download Function =====
function downloadPhotoStrip() {
    if (photos.length === 0) return;
    updateStatus('Generando tira de fotos...');
    
    var stripCanvas = document.createElement('canvas');
    var stripCtx = stripCanvas.getContext('2d');
    
    var photoWidth = 400;
    var photoHeight = 300;
    var margin = photoWidth * 0.05;
    var spacing = photoWidth * 0.025;
    var totalWidth = photoWidth + 2 * margin;
    var totalHeight = (photoHeight + spacing) * PHOTO_COUNT + spacing - 2 * margin;
    
    stripCanvas.width = totalWidth;
    stripCanvas.height = totalHeight;
    
    stripCtx.fillStyle = '#ffffff';
    stripCtx.fillRect(0, 0, totalWidth, totalHeight);
    
    for (var i = 0; i < photos.length; i++) {
        var img = new Image();
        img.src = photos[i];
        var yPos = margin + i * (photoHeight + spacing);
        
        img.onload = function(i, yPos) {
            return function() {
                stripCtx.drawImage(this, margin, yPos, photoWidth, photoHeight);
                if (i === photos.length - 1) {
                    stripCanvas.toBlob(function(blob) {
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'fotomatron-tira-' + new Date().getTime() + '.jpg';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        updateStatus('Listo para empezar');
                    }, 'image/jpeg', 0.92);
                }
            };
        }(i, yPos);
    }
}
