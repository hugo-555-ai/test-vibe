<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotomatón - 5 Fotos</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #1a1a2e;
            --light: #f7fff7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #292f36 100%);
            min-height: 100vh;
            color: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            color: var(--accent);
        }

        .subtitle {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .camera-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.1);
        }

        .camera-frame {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px dashed var(--accent);
            border-radius: 10px;
            pointer-events: none;
        }

        .controls-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            flex-wrap: wrap;
        }

        .time-display {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 10px 15px;
            text-align: center;
            min-width: 100px;
            backdrop-filter: blur(10px);
        }

        .time-display h3 {
            font-size: 0.8em;
            color: var(--accent);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display .value {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--light);
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 140px;
            background: linear-gradient(135deg, var(--primary), #ff8e8e);
            color: white;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .status-bar {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
        }

        .status-bar .status-text {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1em;
        }

        .countdown-display {
            font-size: 4em;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            animation: bounce 1s ease infinite;
            margin: 20px 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .photo-strip-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .photo-strip {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--secondary);
        }

        .photo-slot {
            width: 100%;
            aspect-ratio: 4/3;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-slot .slot-number {
            font-size: 2em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: bold;
        }

        .photo-slot.filled {
            border-color: var(--secondary);
            background: rgba(84, 160, 255, 0.1);
        }

        .confetti-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        .confetti-container.active { display: block; }

        .confetti {
            position: absolute;
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-100px) rotate(0deg); }
            100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--dark);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal h3 { color: var(--primary); margin-bottom: 15px; font-size: 1.8em; }
        .modal p { margin-bottom: 25px; color: rgba(255, 255, 255, 0.9); line-height: 1.6; }
        .modal-actions { display: flex; justify-content: center; gap: 15px; }

        .props-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .props-section h2 {
            text-align: center;
            margin-bottom: 15px;
            color: var(--secondary);
            font-size: 1.3em;
        }

        .props-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .prop-tab {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9em;
        }

        .prop-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 230, 109, 0.1);
        }

        .prop-tab.active {
            border-color: var(--accent);
            color: var(--dark);
            background: var(--accent);
        }

        .props-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .prop-item {
            aspect-ratio: 1;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .prop-item:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 230, 109, 0.3);
        }

        .prop-item.selected {
            border-color: var(--secondary);
            box-shadow: 0 0 20px rgba(84, 160, 255, 0.5);
            transform: scale(1.02);
        }

        .prop-item .prop-emoji {
            font-size: 2em;
            text-align: center;
            line-height: 100%;
            padding: 20px 0;
        }

        .prop-item .prop-name {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px;
            text-align: center;
            font-size: 0.7em;
            font-weight: bold;
            color: white;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .camera-container { max-width: 100%; }
            .controls-section { flex-direction: column; }
            .time-display { min-width: auto; width: 100%; }
            .countdown-display { font-size: 2.5em; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <h3>Error de Camara</h3>
            <p id="errorMessage">No se pudo acceder a la camara.</p>
            <div class="modal-actions">
                <button class="btn" onclick="closeErrorModal()">Reintentar</button>
                <button class="btn" onclick="closeErrorModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <header>
        <h1>Fotomatón</h1>
        <div class="subtitle">5 fotos automaticas</div>
    </header>

    <div class="camera-container">
        <video id="cameraView" autoplay playsinline></video>
        <div class="camera-overlay"></div>
        <div class="camera-frame"></div>
        <canvas id="compositeCanvas" style="display: none;"></canvas>
    </div>

    <div class="controls-section">
        <div class="time-display">
            <h3>Tiempo entre fotos</h3>
            <div class="value" id="timeBetweenValue">3s</div>
        </div>
        <button class="btn" id="startBtn" onclick="startPhotoBooth()">
            <span id="startBtnText">Empezar</span>
        </button>
        <div class="time-display">
            <h3>Tiempo primera foto</h3>
            <div class="value" id="countdownValue">3s</div>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-text" id="statusText">Listo para empezar</span>
        <div class="countdown-display" id="countdownDisplay" style="display: none;"></div>
    </div>

    <div class="photo-strip-container">
        <div class="photo-strip" id="photoStrip"></div>
    </div>

    <div class="props-section">
        <h2>Accesorios</h2>
        <div class="props-tabs">
            <button class="prop-tab active" onclick="switchPropTab('filters')">Filtros</button>
            <button class="prop-tab" onclick="switchPropTab('hats')">Sombreros</button>
            <button class="prop-tab" onclick="switchPropTab('glasses')">Gafas</button>
            <button class="prop-tab" onclick="switchPropTab('backgrounds')">Fondos</button>
            <button class="prop-tab" onclick="switchPropTab('effects')">Efectos</button>
        </div>
        <div class="props-grid" id="propsGrid"></div>
    </div>

    <script>
// ===== Configuration =====
const PHOTO_COUNT = 5;
const TIME_BETWEEN_PHOTOS = 3;
const COUNTDOWN_TIME = 3;

// ===== Global State =====
let stream = null;
let cameraView = null;
let compositeCanvas = null;
let compositeCtx = null;
let photos = [];
let currentPhotoIndex = 0;
let isSessionRunning = false;
let isCountingDown = false;
let countdownTimeout = null;
let photoTimeout = null;
let selectedProps = { filter: null, hat: null, glasses: null, background: null, effect: null };
let currentPropTab = 'filters';

// ===== Prop Definitions =====
const propsData = {
    filters: [
        { id: 'none', name: 'Normal', emoji: '\ud83d\udcf8', type: 'filter' },
        { id: 'sepia', name: 'Sepia', emoji: '\ud83d\udf8a', type: 'filter' },
        { id: 'grayscale', name: 'B/N', emoji: '\u26aa', type: 'filter' },
        { id: 'invert', name: 'Negativo', emoji: '\ud83d\udd33', type: 'filter' },
        { id: 'vintage', name: 'Vintage', emoji: '\ud83d\udcfc', type: 'filter' },
        { id: 'warm', name: 'Calido', emoji: '\ud83d\udd25', type: 'filter' },
        { id: 'cool', name: 'Frio', emoji: '\u2744\ufe0f', type: 'filter' }
    ],
    hats: [
        { id: 'cowboy', name: 'Vaquero', emoji: '\ud83e\udd20', type: 'hat' },
        { id: 'crown', name: 'Corona', emoji: '\ud83d\udc51', type: 'hat' },
        { id: 'santa', name: 'Santa', emoji: '\ud83c\udf85', type: 'hat' },
        { id: 'party', name: 'Fiesta', emoji: '\ud83c\udf89', type: 'hat' },
        { id: 'chef', name: 'Chef', emoji: '\ud83d\udc69\u200d\ud83c\udf73', type: 'hat' },
        { id: 'pirate', name: 'Pirata', emoji: '\u2620\ufe0f', type: 'hat' }
    ],
    glasses: [
        { id: 'sunglasses', name: 'Sol', emoji: '\ud83d\ude0e', type: 'glasses' },
        { id: 'nerd', name: 'Nerd', emoji: '\ud83d\udc53', type: 'glasses' },
        { id: 'heart', name: 'Corazones', emoji: '\ud83d\udc95', type: 'glasses' },
        { id: 'star', name: 'Estrellas', emoji: '\u2b50', type: 'glasses' }
    ],
    backgrounds: [
        { id: 'none', name: 'Ninguno', emoji: '\u2b1c', type: 'background' },
        { id: 'beach', name: 'Playa', emoji: '\ud83c\udf76\ufe0f', type: 'background' },
        { id: 'space', name: 'Espacio', emoji: '\ud83d\ude80', type: 'background' },
        { id: 'city', name: 'Ciudad', emoji: '\ud83c\udf99\ufe0f', type: 'background' }
    ],
    effects: [
        { id: 'none', name: 'Ninguno', emoji: '\u2728', type: 'effect' },
        { id: 'bokeh', name: 'Bokeh', emoji: '\ud83d\udcab', type: 'effect' },
        { id: 'sparkles', name: 'Destellos', emoji: '\u2728', type: 'effect' },
        { id: 'hearts', name: 'Corazones', emoji: '\ud83d\udc96', type: 'effect' }
    ]
};

const backgroundColors = { none: '#000000', beach: '#87CEEB', space: '#000000', city: '#2F4F4F' };

// ===== Initialization =====
document.addEventListener('DOMContentLoaded', function() {
    cameraView = document.getElementById('cameraView');
    compositeCanvas = document.getElementById('compositeCanvas');
    compositeCtx = compositeCanvas.getContext('2d');
    createPhotoSlots();
    loadProps();
    initializeCamera();
});

// ===== Camera Functions =====
async function initializeCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
            audio: false
        });
        cameraView.srcObject = stream;
        updateStatus('Camara lista');
    } catch (error) {
        showErrorModal('Error: ' + error.message);
    }
}

function stopCamera() {
    if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
}

// ===== Photo Booth Functions =====
function startPhotoBooth() {
    if (!stream) { showErrorModal('Camara no disponible.'); return; }
    if (isSessionRunning) return;
    isSessionRunning = true; photos = []; currentPhotoIndex = 0;
    updateStatus('Preparate!');
    document.getElementById('startBtn').disabled = true;
    startCountdown();
}

function startCountdown() {
    if (isCountingDown) return;
    isCountingDown = true; let countdown = COUNTDOWN_TIME;
    const countdownDisplay = document.getElementById('countdownDisplay');
    const statusText = document.getElementById('statusText');
    countdownDisplay.style.display = 'block'; statusText.style.display = 'none';
    function updateCountdown() {
        countdownDisplay.textContent = countdown;
        if (countdown <= 0) {
            countdownDisplay.style.display = 'none'; statusText.style.display = 'block';
            updateStatus('Sonrie!'); isCountingDown = false; takePhoto(); return;
        }
        countdown--; countdownTimeout = setTimeout(updateCountdown, 1000);
    }
    updateCountdown();
}

function takePhoto() {
    if (!stream || !isSessionRunning) return;
    playShutterSound();
    capturePhoto().then(() => {
        currentPhotoIndex++;
        if (currentPhotoIndex >= PHOTO_COUNT) { endPhotoSession(); return; }
        updateStatus(`Foto ${currentPhotoIndex}/${PHOTO_COUNT}. Siguiente en ${TIME_BETWEEN_PHOTOS}s...`);
        photoTimeout = setTimeout(() => { playBeepSound(); takePhoto(); }, TIME_BETWEEN_PHOTOS * 1000);
    });
}

async function capturePhoto() {
    return new Promise((resolve) => {
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        const videoWidth = cameraView.videoWidth;
        const videoHeight = cameraView.videoHeight;
        tempCanvas.width = videoWidth; tempCanvas.height = videoHeight;
        tempCtx.drawImage(cameraView, 0, 0, videoWidth, videoHeight);
        applyPropsToImage(tempCanvas, tempCtx);
        tempCanvas.toBlob((blob) => {
            const photoUrl = URL.createObjectURL(blob);
            photos.push(photoUrl); updatePhotoStrip(); triggerConfetti(); resolve();
        }, 'image/jpeg', 0.92);
    });
}

function applyPropsToImage(canvas, ctx) {
    const width = canvas.width; const height = canvas.height;
    if (selectedProps.background && selectedProps.background !== 'none') {
        ctx.fillStyle = backgroundColors[selectedProps.background] || '#000000';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(cameraView, 0, 0, width, height);
    }
    if (selectedProps.filter && selectedProps.filter !== 'none') applyFilter(ctx, width, height, selectedProps.filter);
    if (selectedProps.hat && selectedProps.hat !== 'none') applyHat(ctx, width, height, selectedProps.hat);
    if (selectedProps.glasses && selectedProps.glasses !== 'none') applyGlasses(ctx, width, height, selectedProps.glasses);
    if (selectedProps.effect && selectedProps.effect !== 'none') applyEffect(ctx, width, height, selectedProps.effect);
}

function endPhotoSession() {
    isSessionRunning = false;
    if (countdownTimeout) clearTimeout(countdownTimeout);
    if (photoTimeout) clearTimeout(photoTimeout);
    document.getElementById('startBtn').disabled = false;
    updateStatus('Procesando fotos...');
    setTimeout(() => { downloadPhotoStrip(); }, 500);
}

function stopPhotoBooth() {
    if (!isSessionRunning) return;
    isSessionRunning = false;
    if (countdownTimeout) clearTimeout(countdownTimeout);
    if (photoTimeout) clearTimeout(photoTimeout);
    document.getElementById('startBtn').disabled = false; updateStatus('Sesion detenida');
}

// ===== Filter Functions =====
function applyFilter(ctx, width, height, filterId) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    switch (filterId) {
        case 'sepia':
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
            } break;
        case 'grayscale':
            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                data[i] = data[i + 1] = data[i + 2] = avg;
            } break;
        case 'invert':
            for (let i = 0; i < data.length; i += 4) {
                data[i] = 255 - data[i]; data[i + 1] = 255 - data[i + 1]; data[i + 2] = 255 - data[i + 2];
            } break;
        case 'vintage':
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * 1.1); data[i + 1] = Math.min(255, data[i + 1] * 0.9);
                data[i + 2] = Math.min(255, data[i + 2] * 0.8);
            }
            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 20 - 10;
                data[i] = Math.max(0, Math.min(255, data[i] + noise));
                data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
            } break;
        case 'warm':
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * 1.1); data[i + 1] = Math.min(255, data[i + 1] * 0.95);
                data[i + 2] = Math.min(255, data[i + 2] * 0.85);
            } break;
        case 'cool':
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * 0.85); data[i + 1] = Math.min(255, data[i + 1] * 0.95);
                data[i + 2] = Math.min(255, data[i + 2] * 1.1);
            } break;
    }
    ctx.putImageData(imageData, 0, 0);
}

// ===== Hat Drawing =====
function applyHat(ctx, width, height, hatId) {
    const hatSize = Math.min(width, height) * 0.3;
    const x = width / 2 - hatSize / 2;
    const y = height * 0.15;
    ctx.save();
    switch (hatId) {
        case 'cowboy':
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(x + hatSize / 2, y + hatSize / 2, hatSize / 2, hatSize / 4, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + hatSize / 2, y + hatSize / 2, hatSize / 1.5, hatSize / 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + hatSize / 2, y + hatSize / 4); ctx.lineTo(x + hatSize / 2, y + hatSize / 2); ctx.stroke(); break;
        case 'crown':
            ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(x + hatSize / 2, y + hatSize / 2, hatSize / 2, hatSize / 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                const pX = x + hatSize / 2 + Math.cos(angle) * hatSize / 2; const pY = y + hatSize / 2 + Math.sin(angle) * hatSize / 4;
                ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(pX + Math.cos(angle) * hatSize / 4, pY + Math.sin(angle) * hatSize / 4);
                ctx.lineTo(pX + Math.cos(angle + 0.2) * hatSize / 6, pY + Math.sin(angle + 0.2) * hatSize / 6); ctx.closePath(); ctx.fill(); ctx.stroke();
            } break;
        case 'santa':
            ctx.fillStyle = '#FF0000'; ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y + hatSize / 2); ctx.quadraticCurveTo(x + hatSize / 2, y - hatSize / 4, x + hatSize, y + hatSize / 2); ctx.lineTo(x, y + hatSize / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#FFF'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, y + hatSize / 2); ctx.quadraticCurveTo(x + hatSize / 2, y - hatSize / 4, x + hatSize, y + hatSize / 2); ctx.stroke();
            ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.ellipse(x + hatSize, y + hatSize / 2, hatSize / 8, hatSize / 8, 0, 0, Math.PI * 2); ctx.fill(); break;
        case 'party':
            ctx.fillStyle = getRandomColor(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x + hatSize / 2, y); ctx.lineTo(x, y + hatSize); ctx.lineTo(x + hatSize, y + hatSize); ctx.closePath(); ctx.fill(); ctx.stroke(); break;
        case 'chef':
            ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(x + hatSize / 2, y + hatSize / 2, hatSize / 2, hatSize / 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(x + hatSize / 2, y + hatSize / 4, hatSize / 4, hatSize / 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); break;
        case 'pirate':
            ctx.fillStyle = '#000'; ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y + hatSize / 2); ctx.quadraticCurveTo(x + hatSize / 2, y - hatSize / 4, x + hatSize / 1.5, y + hatSize / 4);
            ctx.quadraticCurveTo(x + hatSize / 2, y + hatSize / 2, x, y + hatSize / 2); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.ellipse(x + hatSize / 3, y + hatSize / 4, hatSize / 10, hatSize / 10, 0, 0, Math.PI * 2); ctx.fill(); break;
    }
    ctx.restore();
}

// ===== Glasses Drawing =====
function applyGlasses(ctx, width, height, glassesId) {
    const gw = width * 0.4; const gh = height * 0.15;
    const x = width / 2 - gw / 2; const y = height * 0.4;
    ctx.save();
    switch (glassesId) {
        case 'sunglasses':
            ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.ellipse(x + gw / 4, y + gh / 2, gw / 4, gh / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(x + gw * 3/4, y + gh / 2, gw / 4, gh / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.rect(x + gw / 4, y + gh / 2 - 2, gw / 2, 4); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x - gw / 8, y + gh / 2); ctx.lineTo(x - gw / 2, y + gh / 2); ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + gw + gw / 8, y + gh / 2); ctx.lineTo(x + gw + gw / 2, y + gh / 2); ctx.stroke(); break;
        case 'nerd':
            ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(x + gw / 4, y + gh / 2, gw / 5, gh / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + gw * 3/4, y + gh / 2, gw / 5, gh / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.rect(x + gw / 4 + gw / 5, y + gh / 2 - 1, gw / 2 - gw / 5 * 2, 2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x, y + gh / 2); ctx.lineTo(x - gw / 3, y + gh / 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + gw, y + gh / 2); ctx.lineTo(x + gw + gw / 3, y + gh / 2); ctx.stroke(); break;
        case 'heart':
            ctx.fillStyle = '#FF69B4'; ctx.strokeStyle = '#FF1493'; ctx.lineWidth = 3;
            drawHeart(ctx, x + gw / 4, y + gh / 2, gw / 5); drawHeart(ctx, x + gw * 3/4, y + gh / 2, gw / 5);
            ctx.beginPath(); ctx.moveTo(x + gw / 4 + gw / 10, y + gh / 2);
            ctx.quadraticCurveTo(x + gw / 2, y + gh / 4, x + gw * 3/4 - gw / 10, y + gh / 2); ctx.stroke(); break;
        case 'star':
            ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#FFA500'; ctx.lineWidth = 2;
            drawStar(ctx, x + gw / 4, y + gh / 2, gw / 5, gw / 8); drawStar(ctx, x + gw * 3/4, y + gh / 2, gw / 5, gw / 8);
            ctx.beginPath(); ctx.moveTo(x + gw / 4 + gw / 6, y + gh / 2); ctx.lineTo(x + gw * 3/4 - gw / 6, y + gh / 2); ctx.stroke(); break;
    }
    ctx.restore();
}

// ===== Effect Functions =====
function applyEffect(ctx, width, height, effectId) {
    switch (effectId) {
        case 'bokeh':
            for (let i = 0; i < 10; i++) {
                const x = Math.random() * width; const y = Math.random() * height;
                const size = Math.random() * 20 + 10; const opacity = Math.random() * 0.3 + 0.1;
                const color = getRandomPastelColor();
                ctx.fillStyle = color + Math.floor(opacity * 255).toString(16).padStart(2, '0');
                ctx.beginPath(); ctx.ellipse(x, y, size / 2, size / 2, 0, 0, Math.PI * 2); ctx.fill();
            } break;
        case 'sparkles':
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * width; const y = Math.random() * height; const size = Math.random() * 8 + 4; const angle = Math.random() * Math.PI * 2;
                ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1;
                ctx.beginPath();
                for (let j = 0; j < 5; j++) {
                    const or = size; const ir = size / 2;
                    const ox = x + Math.cos(angle + j * Math.PI * 2 / 5) * or;
                    const oy = y + Math.sin(angle + j * Math.PI * 2 / 5) * or;
                    const ix = x + Math.cos(angle + (j + 0.5) * Math.PI * 2 / 5) * ir;
                    const iy = y + Math.sin(angle + (j + 0.5) * Math.PI * 2 / 5) * ir;
                    if (j === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } break;
        case 'hearts':
            for (let i = 0; i < 8; i++) {
                const x = Math.random() * width; const y = Math.random() * height; const size = Math.random() * 15 + 10;
                const color = getRandomColor();
                ctx.fillStyle = color; ctx.strokeStyle = darkenColor(color, 30); ctx.lineWidth = 1;
                drawHeart(ctx, x, y, size);
            } break;
    }
}

// ===== UI Functions =====
function createPhotoSlots() {
    const photoStrip = document.getElementById('photoStrip'); photoStrip.innerHTML = '';
    for (let i = 0; i < PHOTO_COUNT; i++) {
        const slot = document.createElement('div'); slot.className = 'photo-slot'; slot.id = `photoSlot${i}`;
        slot.innerHTML = `<span class="slot-number">${i + 1}</span>`; photoStrip.appendChild(slot);
    }
}

function updatePhotoStrip() {
    for (let i = 0; i < PHOTO_COUNT; i++) {
        const slot = document.getElementById(`photoSlot${i}`);
        if (i < photos.length) { slot.innerHTML = `<img src="${photos[i]}" alt="Foto ${i + 1}">`; slot.classList.add('filled'); }
        else { slot.innerHTML = `<span class="slot-number">${i + 1}</span>`; slot.classList.remove('filled'); }
    }
}

function loadProps() {
    const propsGrid = document.getElementById('propsGrid'); propsGrid.innerHTML = '';
    const props = propsData[currentPropTab];
    props.forEach(prop => {
        const propItem = document.createElement('div'); propItem.className = 'prop-item';
        propItem.id = `prop-${prop.type}-${prop.id}`; propItem.innerHTML = `<div class="prop-emoji">${prop.emoji}</div><div class="prop-name">${prop.name}</div>`;
        if (selectedProps[prop.type] === prop.id) propItem.classList.add('selected');
        propItem.onclick = () => selectProp(prop.type, prop.id); propsGrid.appendChild(propItem);
    });
}

function switchPropTab(tab) {
    currentPropTab = tab;
    document.querySelectorAll('.prop-tab').forEach(tabBtn => {
        tabBtn.classList.remove('active');
        if (tabBtn.textContent.trim() === getTabName(tab)) tabBtn.classList.add('active');
    });
    loadProps();
}

function getTabName(tab) {
    const tabNames = { filters: 'Filtros', hats: 'Sombreros', glasses: 'Gafas', backgrounds: 'Fondos', effects: 'Efectos' };
    return tabNames[tab] || tab;
}

function selectProp(type, id) {
    if (selectedProps[type] === id) selectedProps[type] = null; else selectedProps[type] = id;
    loadProps(); updateStatus(`Accesorio: ${getPropName(type, id) || 'Ninguno'}`);
}

function getPropName(type, id) {
    if (!id || id === 'none') return null; const props = propsData[type]; if (!props) return null;
    const prop = props.find(p => p.id === id); return prop ? prop.name : null;
}

function updateStatus(message) { document.getElementById('statusText').textContent = message; }

// ===== Download Functions =====
function downloadPhotoStrip() {
    if (photos.length === 0) return;
    const stripCanvas = document.createElement('canvas'); const stripCtx = stripCanvas.getContext('2d');
    const photoWidth = 200, photoHeight = 150, margin = 10;
    const stripWidth = photoWidth; const stripHeight = photoHeight * photos.length + margin * (photos.length + 1);
    stripCanvas.width = stripWidth; stripCanvas.height = stripHeight;
    stripCtx.fillStyle = '#1a1a2e'; stripCtx.fillRect(0, 0, stripWidth, stripHeight);
    stripCtx.strokeStyle = '#4ecdc4'; stripCtx.lineWidth = 3; stripCtx.strokeRect(5, 5, stripWidth - 10, stripHeight - 10);
    stripCtx.fillStyle = '#ffe66d'; stripCtx.font = 'bold 18px Comic Neue, cursive'; stripCtx.textAlign = 'center';
    stripCtx.fillText('Fotomatón', stripWidth / 2, 30);
    stripCtx.fillStyle = '#ff6b6b'; stripCtx.font = '14px Comic Neue, cursive';
    stripCtx.fillText(new Date().toLocaleDateString('es-ES'), stripWidth / 2, 50);
    let photosLoaded = 0;
    photos.forEach((photoUrl, index) => {
        const img = new Image();
        img.onload = () => {
            const y = margin + index * (photoHeight + margin);
            stripCtx.strokeStyle = '#ff6b6b'; stripCtx.lineWidth = 2;
            stripCtx.strokeRect(5, y - 5, photoWidth - 10, photoHeight + 10);
            stripCtx.drawImage(img, 5, y, photoWidth - 10, photoHeight);
            stripCtx.fillStyle = '#ffe66d'; stripCtx.font = 'bold 16px Comic Neue, cursive';
            stripCtx.fillText(`${index + 1}`, photoWidth / 2, y + photoHeight + 25);
            photosLoaded++;
            if (photosLoaded === photos.length) {
                const link = document.createElement('a');
                link.download = `fotomatron-${new Date().toISOString().slice(0, 10)}.jpg`;
                link.href = stripCanvas.toDataURL('image/jpeg', 0.92);
                link.click(); updateStatus('Descarga completada!');
            }
        };
        img.onerror = () => { photosLoaded++; if (photosLoaded === photos.length) updateStatus('Error al crear tira'); };
        img.src = photoUrl;
    });
}

// ===== Error Handling =====
function showErrorModal(message) { document.getElementById('errorMessage').textContent = message; document.getElementById('errorModal').classList.add('active'); }
function closeErrorModal() { document.getElementById('errorModal').classList.remove('active'); initializeCamera(); }

// ===== Effects =====
function triggerConfetti() {
    const cc = document.getElementById('confettiContainer'); cc.innerHTML = ''; cc.classList.add('active');
    const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff9ff3', '#54a0ff'];
    for (let i = 0; i < 30; i++) {
        const c = document.createElement('div'); c.className = 'confetti';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.left = Math.random() * 100 + '%'; c.style.top = '-20px';
        c.style.width = Math.random() * 8 + 4 + 'px'; c.style.height = c.style.width;
        c.style.animationDuration = (Math.random() * 2 + 2) + 's';
        c.style.animationDelay = Math.random() * 0.5 + 's';
        cc.appendChild(c);
    }
    setTimeout(() => cc.classList.remove('active'), 3000);
}

function playShutterSound() {
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const bs = ac.sampleRate * 0.1; const b = ac.createBuffer(1, bs, ac.sampleRate);
        const d = b.getChannelData(0); for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
        const n = ac.createBufferSource(); n.buffer = b;
        const e = ac.createGain(); e.gain.setValueAtTime(0.3, ac.currentTime); e.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + 0.05);
        n.connect(e); e.connect(ac.destination); n.start(ac.currentTime); n.stop(ac.currentTime + 0.1);
    } catch (e) {}
}

function playBeepSound() {
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(800, ac.currentTime);
        const g = ac.createGain(); g.gain.setValueAtTime(0.1, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + 0.05);
        o.connect(g); g.connect(ac.destination); o.start(ac.currentTime); o.stop(ac.currentTime + 0.05);
    } catch (e) {}
}

// ===== Helpers =====
function drawHeart(ctx, x, y, size) {
    ctx.beginPath(); ctx.moveTo(x, y - size / 2);
    ctx.bezierCurveTo(x - size / 2, y - size / 2, x - size, y, x, y + size / 2);
    ctx.bezierCurveTo(x + size, y, x + size / 2, y - size / 2, x, y - size / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawStar(ctx, x, y, outerRadius, innerRadius, rotation = 0) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const oa = rotation + i * Math.PI * 2 / 5; const ia = rotation + (i + 0.5) * Math.PI * 2 / 5;
        const ox = x + Math.cos(oa) * outerRadius; const oy = y + Math.sin(oa) * outerRadius;
        const ix = x + Math.cos(ia) * innerRadius; const iy = y + Math.sin(ia) * innerRadius;
        if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy); ctx.lineTo(ix, iy);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
}

function getRandomColor() { return ['#FF69B4','#FF6347','#FFD700','#9370DB','#32CD32','#1E90FF','#FF8C00','#FF1493'][Math.floor(Math.random() * 8)]; }
function getRandomPastelColor() { return ['#FFD1DC','#FFE5B4','#B5EAD7','#C7CEEA','#E2F0CB','#FFB7B7','#F8C8DC','#B2E2E2'][Math.floor(Math.random() * 8)]; }
function darkenColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16); const amt = Math.round(2.55 * percent);
    const R = Math.max(0, (num >> 16) - amt); const G = Math.max(0, (num >> 8 & 0x00FF) - amt); const B = Math.max(0, (num & 0x0000FF) - amt);
    return '#' + (0x1000000 + (R * 0x10000) + (G * 0x100) + B).toString(16).slice(1);
}

// ===== Cleanup =====
window.addEventListener('beforeunload', function() { stopCamera(); photos.forEach(url => URL.revokeObjectURL(url)); });
